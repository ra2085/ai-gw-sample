site_name: Apigee AI Gateway
site_url: https://ra2085.github.io/ai-gw-sample/
site_description: Enterprise AI Gateway with Smart Routing, LLM Judge, Model Armor Security, and Token Monetization on Google Cloud Apigee.
site_author: Apigee AI Team
repo_name: ra2085/ai-gw-sample
repo_url: https://github.com/ra2085/ai-gw-sample

theme:
  name: material
  logo: img/Apigee-512-color.png
  favicon: img/Apigee-512-color.png
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

extra_css:
  - stylesheets/extra.css


markdown_extensions:
  - admonition
  - abbr
  - attr_list
  - def_list
  - tables
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Overview: index.md
  - 1. Getting Started:
      - 5-Minute Quickstart: getting-started/quickstart-template.md
      - Installation & Setup: getting-started/installation.md
      - End-to-End Walkthrough: getting-started/quickstart.md
      - Choose Your Workflow: getting-started/choose-workflow.md
  - 2. Model Configuration:
      - Custom Providers & URLs: template-guide/custom-urls.md
      - Configuration Reference: template-guide/configuration.md
      - Feature Toggles: template-guide/feature-flags.md
  - 3. Enterprise Features:
      - Smart Routing & LLM Judge: architecture/routing.md
      - Security & Model Armor: architecture/security.md
      - Token Monetization & Quotas: architecture/monetization.md
  - 4. Architecture & Deep Dive:
      - Protocol Normalization: architecture/protocols.md
      - Proxy & Policies Catalog: proxy-deep-dive/policies-reference.md
      - JavaScript Callouts & Streaming: proxy-deep-dive/javascript-callouts.md
      - Targets & Cloud Auth: proxy-deep-dive/targets-and-routing.md
      - Bundle & PropertySets: proxy-deep-dive/bundle-structure.md
  - 5. Operations & CI/CD:
      - Deployment Guide: operations/deployment.md
      - Automated Testing: operations/testing.md
      - Telemetry & Data Collectors: operations/telemetry.md


