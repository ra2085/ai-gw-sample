site_name: Apigee AI Gateway
site_url: https://ra2085.github.io/ai-gw-sample/
site_description: Enterprise AI Gateway with Persona-Based Auth, Universal Protocol Transcoding, Per-Model & Team Quotas, Model Armor Security, and Cache-Aware Monetization on Google Cloud Apigee.
site_author: Apigee AI Team
repo_name: ra2085/ai-gw-sample
repo_url: https://github.com/ra2085/ai-gw-sample

theme:
  name: material
  logo: img/Apigee-512-color.png
  favicon: img/Apigee-512-color.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  font:
    text: Google Sans Text
    code: Roboto Mono

  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - abbr
  - attr_list
  - def_list
  - tables
  - footnotes
  - md_in_html
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Overview: index.md
  - 1. Getting Started:
      - 5-Minute Quickstart: getting-started/quickstart-template.md
      - Installation & Setup: getting-started/installation.md
      - Choose Your Workflow: getting-started/choose-workflow.md
      - End-to-End Walkthrough: getting-started/quickstart.md
  - 2. Configuration & Models:
      - values.yaml Schema Reference: template-guide/configuration.md
      - Models, Providers & Custom URLs: template-guide/custom-urls.md
      - Feature Toggles & Decision Matrix: template-guide/feature-flags.md
  - 3. Enterprise Governance:
      - Auth, Persona Tiers & Security: architecture/security.md
      - Quotas, Rate Limits, Budgets & Cost: architecture/monetization.md
      - Smart Routing & LLM Judge: architecture/routing.md
  - 4. Architecture & Deep Dive:
      - Protocol Normalization & Embeddings: architecture/protocols.md
      - Bundle Structure & Execution Flow: proxy-deep-dive/bundle-structure.md
      - Policies Reference Catalog: proxy-deep-dive/policies-reference.md
      - JavaScript Callouts & Memory Safety: proxy-deep-dive/javascript-callouts.md
      - Targets & Upstream Auth: proxy-deep-dive/targets-and-routing.md
  - 5. Operations & Observability:
      - Deployment & Testing Guide: operations/deployment.md
      - Telemetry, Headers & Data Collectors: operations/telemetry.md
      - Looker Studio Cost Dashboard: operations/looker-studio-dashboard.md
