site_name: Apigee AI Gateway
site_url: https://ra2085.github.io/ai-gw-sample/
site_description: Enterprise AI Gateway with Persona-Based Auth, Universal Protocol Transcoding, Per-Model & Team Quotas, Model Armor Security, and Cache-Aware Monetization on Google Cloud Apigee.
site_author: Apigee AI Team
repo_name: ra2085/ai-gw-sample
repo_url: https://github.com/ra2085/ai-gw-sample

theme:
  name: material
  logo: img/Apigee-512-color.png
  favicon: img/Apigee-512-color.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  font:
    text: Google Sans Text
    code: Roboto Mono

  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - abbr
  - attr_list
  - def_list
  - tables
  - footnotes
  - md_in_html
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Getting Started:
      - Overview: index.md
      - 5-Minute Quickstart: getting-started/quickstart-template.md
      - Prerequisites & Setup: getting-started/installation.md
  - Guides:
      - AI Products, Tenancy & Auth: architecture/security.md
      - Models & Providers: template-guide/custom-urls.md
      - Quotas, Budgets & Cost Control: architecture/monetization.md
      - Smart Routing & Content Safety: architecture/routing.md
  - Reference:
      - values.yaml Reference: template-guide/configuration.md
      - Feature Toggles: template-guide/feature-flags.md
      - Client Endpoints & Protocols: architecture/protocols.md
      - Extending the Proxy (Advanced):
          - Workflow Options: getting-started/choose-workflow.md
          - Bundle Structure: proxy-deep-dive/bundle-structure.md
          - Targets & Upstream Auth: proxy-deep-dive/targets-and-routing.md
          - Policies Catalog: proxy-deep-dive/policies-reference.md
          - JavaScript Callouts: proxy-deep-dive/javascript-callouts.md
  - Analytics & Operations:
      - Telemetry & Headers: operations/telemetry.md
      - Looker Studio Cost Dashboard: operations/looker-studio-dashboard.md
      - Testing & CI/CD Validation: operations/deployment.md

