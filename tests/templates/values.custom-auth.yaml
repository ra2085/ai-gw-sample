# ==============================================================================
# Apigee AI Gateway - Custom Auth Integration Test Template
# ==============================================================================

gateway:
  name: "ai-gateway"
  display_name: "Apigee Enterprise AI Gateway"
  project_id: "my-gcp-project"

endpoints:
  claude_messages:
    enabled: true
    name: "claude-messages"
    base_path: "/v1/messages"

  gemini_native:
    enabled: true
    name: "gemini-native"
    base_path: "/ai-gateway"

  openai_compat:
    enabled: true
    name: "openai-compat"
    base_path: "/v1/chat/completions"

  models_catalog:
    enabled: true
    name: "claude-models"
    base_path: "/v1/models"

features:
  auth:
    enabled: true
    header_name: "x-api-key"

  quotas:
    enabled: false

  monetization:
    enabled: false

  model_armor:
    enabled: false

  llm_judge:
    enabled: false

models:
  - name: "gemini-2.5-flash"
    displayName: "Gemini 2.5 Flash"
    publisher: "google"
    target: "gemini"
    format: "gemini"
    region: "global"
    is_default: true

  - name: "claude-haiku-4-5"
    displayName: "Claude 4.5 Haiku"
    publisher: "anthropic"
    target: "claude"
    format: "anthropic"
    region: "us-east5"

  - name: "my-vllm-model"
    displayName: "Llama 3 (Self-Hosted)"
    publisher: "openai"
    target: "gemini-openai-compat"
    format: "openai"
    custom_url: "https://34.107.220.83.nip.io/custom/v1/chat/completions"

routing:
  tiers:
    cheap: "gemini-2.5-flash"
    fast: "gemini-2.5-flash"
    medium: "gemini-2.5-flash"
    quality: "claude-haiku-4-5"
    judge: "gemini-2.5-flash"

defaults:
  model: "gemini-2.5-flash"
  fallback: "gemini-2.5-flash"
