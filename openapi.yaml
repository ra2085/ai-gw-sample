              $ref: '#/components/schemas/GeminiBatchEmbedContentsRequest'
      responses:
        '200':
          description: Successful batch embedding response.
        '403':
          description: Forbidden. Unauthorized project or model.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/models:
    get:
      tags:
        - Models Catalog API
      summary: List available models
      description: Returns a list of models available to the caller's persona in the AI Gateway.
      parameters:
        - name: key
          in: query
          required: false
          schema:
            type: string
        - name: apikey
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Successful response. Returns a list of models.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelListResponse'
        '401':
          description: Unauthorized. Missing or invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal gateway error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/models/{modelId}:
    get:
      tags:
        - Models Catalog API
      summary: Retrieve model details
      description: Returns details of a specific model available in the AI Gateway.
      parameters:
        - name: modelId
          in: path
          required: true
          description: The ID of the model to retrieve.
          schema:
            type: string
            example: claude-sonnet-4-6
        - name: key
          in: query
          required: false
          schema:
            type: string
        - name: apikey
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Successful response. Returns the model details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model'
        '401':
          description: Unauthorized. Missing or invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Model not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelErrorResponse'

components:
  securitySchemes:
    ApiKeyHeaderAuth:
      type: apiKey
      in: header
      name: x-api-key
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-apikey
    AnthropicAltApiKeyAuth:
      type: apiKey
      in: header
      name: anthropic-api-key
    GoogleApiKeyAuth:
      type: apiKey
      in: header
      name: x-goog-api-key
    AzureApiKeyAuth:
      type: apiKey
      in: header
      name: api-key
    BearerAuth:
      type: http
      scheme: bearer
  schemas:
    ClaudeMessageItem:
      type: object
      additionalProperties: true
      required:
        - role
        - content
      properties:
        role:
          type: string
          enum: [user, assistant]
          example: user
        content:
          oneOf:
            - type: string
              example: Explain gravity in one sentence.
            - type: array
              items:
                type: object
                additionalProperties: true
                properties:
                  type:
                    type: string
                    description: Content block type (text, image, document, tool_use, tool_result, thinking, redacted_thinking).
                  text:
                    type: string
                  id:
                    type: string
                  name:
                    type: string
                  input:
                    type: object
                    additionalProperties: true
                  tool_use_id:
                    type: string
                  content:
                    oneOf:
                      - type: string
                      - type: array
                        items:
                          type: object
                          additionalProperties: true
                  is_error:
                    type: boolean
                  source:
                    type: object
                    additionalProperties: true
                  cache_control:
                    type: object
                    additionalProperties: true
                  thinking:
                    type: string
                  signature:
                    type: string

    ClaudeRequest:
      type: object
      additionalProperties: true
      required:
        - model
        - max_tokens
        - messages
      properties:
        model:
          type: string
          description: Target model identifier.
          example: claude-haiku-4-5
        models:
          type: array
          description: Optional fallback model array.
          items:
            type: string
        plugins:
          type: array
          description: Optional AI Gateway plugins (e.g. judge, auto-router, task-classifier).
          items:
            type: object
            additionalProperties: true
        max_tokens:
          type: integer
          description: Maximum tokens to generate.
          example: 100
        stream:
          type: boolean
          description: Enable SSE streaming response.
          default: false
        system:
          oneOf:
            - type: string
            - type: array
              items:
                type: object
                additionalProperties: true
        temperature:
          type: number
        top_p:
          type: number
        top_k:
          type: integer
        stop_sequences:
          type: array
          items:
            type: string
        tools:
          type: array
          items:
            type: object
            additionalProperties: true
        tool_choice:
          type: object
          additionalProperties: true
        thinking:
          type: object
          additionalProperties: true
        metadata:
          type: object
          additionalProperties: true
        service_tier:
          type: string
        anthropic_version:
          type: string
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ClaudeMessageItem'

    ClaudeVertexRequest:
      type: object
      additionalProperties: true
      required:
        - max_tokens
        - messages
      properties:
        model:
          type: string
          description: Target model identifier (optional when passed in Vertex URL path).
          example: claude-haiku-4-5
        anthropic_version:
          type: string
          example: vertex-2023-10-16
        max_tokens:
          type: integer
          description: Maximum tokens to generate.
          example: 100
        stream:
          type: boolean
          description: Enable SSE streaming response.
          default: false
        system:
          oneOf:
            - type: string
            - type: array
              items:
                type: object
                additionalProperties: true
        temperature:
          type: number
        top_p:
          type: number
        top_k:
          type: integer
        stop_sequences:
          type: array
          items:
            type: string
        tools:
          type: array
          items:
            type: object
            additionalProperties: true
        tool_choice:
          type: object
          additionalProperties: true
        thinking:
          type: object
          additionalProperties: true
        metadata:
          type: object
          additionalProperties: true
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ClaudeMessageItem'

    ClaudeResponse:
      type: object
      additionalProperties: true
      properties:
        id:
          type: string
        type:
          type: string
          example: message
        role:
          type: string
          example: assistant
        model:
          type: string
        content:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              type:
                type: string
                example: text
              text:
                type: string
              id:
                type: string
              name:
                type: string
              input:
                type: object
                additionalProperties: true
              thinking:
                type: string
              signature:
                type: string
        stop_reason:
          type: string
          example: end_turn
        usage:
          type: object
          additionalProperties: true
          properties:
            input_tokens:
              type: integer
            output_tokens:
              type: integer
            cache_creation_input_tokens:
              type: integer
            cache_read_input_tokens:
              type: integer

    GeminiRequest:
      type: object
      additionalProperties: true
      required:
        - contents
      properties:
        systemInstruction:
          type: object
          additionalProperties: true
        system_instruction:
          type: object
          additionalProperties: true
        tools:
          type: array
          items:
            type: object
            additionalProperties: true
        toolConfig:
          type: object
          additionalProperties: true
        tool_config:
          type: object
          additionalProperties: true
        generationConfig:
          type: object
          additionalProperties: true
        generation_config:
          type: object
          additionalProperties: true
        safetySettings:
          type: array
          items:
            type: object
            additionalProperties: true
        cachedContent:
          type: string
        labels:
          type: object
          additionalProperties: true
        contents:
          type: array
          items:
            type: object
            additionalProperties: true
            required:
              - parts
            properties:
              role:
                type: string
                enum: [user, model, function, tool]
                example: user
              parts:
                type: array
                items:
                  type: object
                  additionalProperties: true
                  properties:
                    text:
                      type: string
                      example: Describe gravity in one sentence.
                    inlineData:
                      type: object
                      additionalProperties: true
                    fileData:
                      type: object
                      additionalProperties: true
                    functionCall:
                      type: object
                      additionalProperties: true
                    functionResponse:
                      type: object
                      additionalProperties: true
                    thought:
                      type: boolean

    GeminiResponse:
      type: object
      additionalProperties: true
      properties:
        candidates:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              content:
                type: object
                additionalProperties: true
                properties:
                  role:
                    type: string
                    example: model
                  parts:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      properties:
                        text:
                          type: string
              finishReason:
                type: string
                example: STOP
        usageMetadata:
          type: object
          additionalProperties: true
          properties:
            promptTokenCount:
              type: integer
            candidatesTokenCount:
              type: integer
            totalTokenCount:
              type: integer

    OpenAIRequest:
      type: object
      additionalProperties: true
      required:
        - model
        - messages
      properties:
        model:
          type: string
          description: Target model identifier.
          example: gemini-3.1-flash-lite
        models:
          type: array
          description: Optional fallback model array (OpenRouter / AI Gateway convention).
          items:
            type: string
        plugins:
          type: array
          description: Optional AI Gateway plugins (e.g. judge, auto-router, task-classifier).
          items:
            type: object
            additionalProperties: true
        stream:
          type: boolean
          description: Enable SSE streaming response.
          default: false
        stream_options:
          type: object
          additionalProperties: true
        max_tokens:
          type: integer
        max_completion_tokens:
          type: integer
        temperature:
          type: number
        top_p:
          type: number
        reasoning_effort:
          type: string
        tools:
          type: array
          items:
            type: object
            additionalProperties: true
        tool_choice:
          oneOf:
            - type: string
            - type: object
              additionalProperties: true
        parallel_tool_calls:
          type: boolean
        response_format:
          type: object
          additionalProperties: true
        metadata:
          type: object
          additionalProperties: true
        user:
          type: string
        messages:
          type: array
          items:
            type: object
            additionalProperties: true
            required:
              - role
            properties:
              role:
                type: string
                enum: [user, assistant, system, developer, tool, function]
                example: user
              content:
                nullable: true
                oneOf:
                  - type: string
                    example: Explain gravity in one sentence.
                  - type: array
                    items:
                      type: object
                      additionalProperties: true
              name:
                type: string
              tool_call_id:
                type: string
              tool_calls:
                type: array
                items:
                  type: object
                  additionalProperties: true

    OpenAIResponse:
      type: object
      additionalProperties: true
      properties:
        id:
          type: string
        object:
          type: string
          example: chat.completion
        created:
          type: integer
          example: 1783446781
        model:
          type: string
        choices:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              index:
                type: integer
              message:
                type: object
                additionalProperties: true
                properties:
                  role:
                    type: string
                    example: assistant
                  content:
                    type: string
                    nullable: true
                  tool_calls:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
              finish_reason:
                type: string
                example: stop
        usage:
          type: object
          additionalProperties: true
          properties:
            prompt_tokens:
              type: integer
            completion_tokens:
              type: integer
            total_tokens:
              type: integer

    EmbeddingRequest:
      type: object
      additionalProperties: true
      required:
        - model
        - input
      properties:
        model:
          type: string
          description: Embedding model identifier (e.g. text-embedding-005, text-embedding-3-small).
          example: text-embedding-005
        input:
          description: Input text or array of strings to embed.
          oneOf:
            - type: string
            - type: array
              items:
                type: string
          example: Explain gravity in one sentence.
        dimensions:
          type: integer
          description: Optional output embedding dimensionality.
        encoding_format:
          type: string
          enum: [float, base64]
        task_type:
          type: string
          description: Optional Vertex AI embedding task_type (e.g. RETRIEVAL_DOCUMENT, RETRIEVAL_QUERY).
        user:
          type: string

    EmbeddingResponse:
      type: object
      additionalProperties: true
      properties:
        object:
          type: string
          example: list
        data:
          type: array
          items:
            type: object
            properties:
              object:
                type: string
                example: embedding
              index:
                type: integer
                example: 0
              embedding:
                type: array
                items:
                  type: number
        model:
          type: string
          example: text-embedding-005
        usage:
          type: object
          properties:
            prompt_tokens:
              type: integer
            total_tokens:
              type: integer

    VertexPredictEmbeddingRequest:
      type: object
      additionalProperties: true
      required:
        - instances
      properties:
        instances:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              content:
                type: string
              text:
                type: string
              task_type:
                type: string
              title:
                type: string
        parameters:
          type: object
          additionalProperties: true
          properties:
            outputDimensionality:
              type: integer
            autoTruncate:
              type: boolean

    VertexPredictEmbeddingResponse:
      type: object
      additionalProperties: true
      properties:
        predictions:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              embeddings:
                type: object
                additionalProperties: true
                properties:
                  values:
                    type: array
                    items:
                      type: number
                  statistics:
                    type: object
                    properties:
                      truncated:
                        type: boolean
                      token_count:
                        type: integer

    GeminiEmbedContentRequest:
      type: object
      additionalProperties: true
      properties:
        model:
          type: string
        content:
          type: object
          additionalProperties: true
        taskType:
          type: string
        title:
          type: string
        outputDimensionality:
          type: integer

    GeminiBatchEmbedContentsRequest:
      type: object
      additionalProperties: true
      properties:
        requests:
          type: array
          items:
            $ref: '#/components/schemas/GeminiEmbedContentRequest'

    ErrorResponse:
      type: object
      additionalProperties: true
      properties:
        type:
          type: string
          example: error
        error:
          type: object
          additionalProperties: true
          properties:
            type:
              type: string
              example: invalid_request_error
            message:
              type: string
              example: Request blocked by AI Gateway policy.
            code:
              oneOf:
                - type: integer
                - type: string
              example: 403

    Model:
      type: object
      additionalProperties: true
      properties:
        type:
          type: string
          example: model
        id:
          type: string
          example: claude-sonnet-4-6
        display_name:
          type: string
          example: Claude Sonnet 4.6
        created_at:
          type: string
          format: date-time
          example: 2026-05-01T00:00:00Z

    ModelListResponse:
      type: object
      additionalProperties: true
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Model'
        has_more:
          type: boolean
          example: false
        first_id:
          type: string
          example: claude-haiku-4-5
        last_id:
          type: string
          example: claude-sonnet-4-6

    ModelErrorResponse:
      type: object
      additionalProperties: true
      properties:
        error:
          type: object
          additionalProperties: true
          properties:
            type:
              type: string
              example: not_found_error
            message:
              type: string
              example: Model not found
