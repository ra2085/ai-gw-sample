openapi: 3.0.3
info:
  title: AI Gateway API
  description: |
    Unified Gateway API for accessing Anthropic Claude, Google Gemini, OpenAI, and BYO LLM/Embedding models.
    Supports Anthropic Claude Messages API, OpenAI Chat Completions & Embeddings, Vertex AI Anthropic (:rawPredict/:streamRawPredict), and native Google Gemini Vertex AI (:generateContent/:streamGenerateContent/:predict/:embedContent/:batchEmbedContents), across both standard JSON and Server-Sent Events (SSE) streaming traffic.
  version: 1.0.0
servers:
  - url: https://workshop.iloveapi.management
    description: Production environment
security:
  - ApiKeyHeaderAuth: []
  - ApiKeyAuth: []
  - AnthropicAltApiKeyAuth: []
  - GoogleApiKeyAuth: []
  - AzureApiKeyAuth: []
  - BearerAuth: []
paths:
  /v1/messages:
    post:
      tags:
        - Claude Messages Format
      summary: Send a message to Claude
      description: Sends a prompt to the assistant and receives a response in Claude's messages format.
      parameters:
        - name: beta
          in: query
          required: false
          schema:
            type: boolean
        - name: key
          in: query
          required: false
          schema:
            type: string
        - name: apikey
          in: query
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaudeRequest'
            examples:
              safe_request:
                summary: Standard non-streaming prompt
                value:
                  model: claude-haiku-4-5
                  max_tokens: 100
                  messages:
                    - role: user
                      content: Explain gravity in one sentence.
              streaming_request:
                summary: Streaming prompt
                value:
                  model: claude-haiku-4-5
                  max_tokens: 100
                  stream: true
                  messages:
                    - role: user
                      content: Respond with 'Bonjour'.
      responses:
        '200':
          description: Successful response. Returns message JSON (non-streaming) or Event Stream (streaming).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaudeResponse'
              examples:
                non_streaming_response:
                  summary: Non-streaming response
                  value:
                    id: msg_12345
                    type: message
                    role: assistant
                    model: claude-haiku-4-5-20251001
                    content:
                      - type: text
                        text: Gravity is the force that pulls objects toward each other due to their mass.
                    stop_reason: end_turn
                    usage:
                      input_tokens: 10
                      output_tokens: 15
            text/event-stream:
              schema:
                type: string
        '401':
          description: Unauthorized. Missing or invalid authentication credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden. Prompt blocked by safety filters (Model Armor) or unauthorized model/persona.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too Many Requests. Rate limit or token quota exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/chat/completions:
    post:
      tags:
        - OpenAI Completions Format
      summary: Send a chat completion request (OpenAI format)
      description: Sends a chat completion prompt using standard OpenAI payload formats (including tool calling, multimodal blocks, developer/tool roles, and reasoning controls). Supports both streaming (SSE) and non-streaming responses.
      parameters:
        - name: key
          in: query
          required: false
          schema:
            type: string
        - name: apikey
          in: query
          required: false
          schema:
            type: string
        - name: api-version
          in: query
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenAIRequest'
            examples:
              safe_request:
                summary: Standard non-streaming prompt
                value:
                  model: gemini-3.1-flash-lite
                  messages:
                    - role: user
                      content: Explain gravity in one sentence.
              streaming_request:
                summary: Streaming prompt
                value:
                  model: gemini-3.1-flash-lite
                  stream: true
                  messages:
                    - role: user
                      content: Respond with 'Bonjour'.
      responses:
        '200':
          description: Successful response. Returns chat completion JSON (non-streaming) or Event Stream (streaming).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIResponse'
              example:
                id: chatcmpl-12345
                object: chat.completion
                created: 1783446781
                model: google/gemini-3.1-flash-lite
                choices:
                  - index: 0
                    message:
                      role: assistant
                      content: Gravity is the force of attraction that pulls objects with mass toward each other.
                    finish_reason: stop
                usage:
                  prompt_tokens: 8
                  completion_tokens: 14
                  total_tokens: 22
            text/event-stream:
              schema:
                type: string
        '401':
          description: Unauthorized. Missing or invalid authentication credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden. Prompt blocked by safety filters (Model Armor) or unauthorized model/persona.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too Many Requests. Rate limit or token quota exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/embeddings:
    post:
      tags:
        - OpenAI Completions Format
      summary: Create embeddings (OpenAI format)
      description: Creates an embedding vector representing the input text using Vertex AI or OpenAI-compatible embedding models.
      parameters:
        - name: key
          in: query
          required: false
          schema:
            type: string
        - name: apikey
          in: query
          required: false
          schema:
            type: string
        - name: api-version
          in: query
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbeddingRequest'
            example:
              model: text-embedding-005
              input: "Explain gravity in one sentence."
      responses:
        '200':
          description: Successful embedding response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddingResponse'
        '401':
          description: Unauthorized. Missing or invalid authentication credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden. Prompt blocked by safety filters (Model Armor) or unauthorized model.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too Many Requests. Rate limit or token quota exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/projects/{projectId}/locations/{locationId}/publishers/google/models/{modelId}:generateContent:
    post:
      tags:
        - Native Gemini Format
      summary: Generate content (Non-Streaming)
      description: Sends a prompt to the specified Gemini model and receives a single complete response.
      parameters:
        - name: projectId
          in: path
          required: true
          description: Google Cloud project ID.
          schema:
            type: string
            example: your-project-id
        - name: locationId
          in: path
          required: true
          description: Vertex AI region location.
          schema:
            type: string
            example: global
        - name: modelId
          in: path
          required: true
          description: Model ID (e.g., gemini-2.5-flash, gemini-3.1-flash-lite).
          schema:
            type: string
            example: gemini-2.5-flash
        - name: alt
          in: query
          required: false
          schema:
            type: string
            enum: [sse, json]
        - name: key
          in: query
          required: false
          schema:
            type: string
        - name: apikey
          in: query
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeminiRequest'
            example:
              contents:
                - role: user
                  parts:
                    - text: Describe gravity in one sentence.
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeminiResponse'
              example:
                candidates:
                  - content:
                      role: model
                      parts:
                        - text: Gravity is the force of attraction that pulls objects with mass toward each other.
                    finishReason: STOP
                usageMetadata:
                  promptTokenCount: 8
                  candidatesTokenCount: 14
                  totalTokenCount: 22
        '403':
          description: Forbidden. Prompt blocked by safety filters (Model Armor) or unauthorized project/model.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

