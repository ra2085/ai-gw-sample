        - Vertex Embeddings Format
      summary: Batch embed contents (:batchEmbedContents)
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: locationId
          in: path
          required: true
          schema:
            type: string
        - name: modelId
          in: path
          required: true
          schema:
            type: string
        - name: alt
          in: query
          required: false
          schema:
            type: string
            enum: [sse, json]
        - name: key
          in: query
          required: false
          schema:
            type: string
        - name: apikey
          in: query
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeminiBatchEmbedContentsRequest'
      responses:
        '200':
          description: Successful batch embedding response.
        '403':
          description: Forbidden. Unauthorized project or model.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1beta1/projects/{projectId}/locations/{locationId}/publishers/google/models/{modelId}:batchEmbedContents:
    post:
      tags:
        - Vertex Embeddings Format
      summary: Batch embed contents (:batchEmbedContents)
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: locationId
          in: path
          required: true
          schema:
            type: string
        - name: modelId
          in: path
          required: true
          schema:
            type: string
        - name: alt
          in: query
          required: false
          schema:
            type: string
            enum: [sse, json]
        - name: key
          in: query
          required: false
          schema:
            type: string
        - name: apikey
          in: query
