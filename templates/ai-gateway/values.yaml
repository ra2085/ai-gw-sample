# ==============================================================================
# Apigee AI Gateway - Declarative Values Configuration
# ==============================================================================

gateway:
  name: "ai-gateway"
  displayName: "Apigee Enterprise AI Gateway"
  description: "Enterprise AI Gateway with Smart Routing, LLM Judge, Model Armor Security, and Token Monetization"
  revision: 1
  project_id: "your-gcp-project-id"

# ------------------------------------------------------------------------------
# Feature Toggles
# ------------------------------------------------------------------------------
features:
  monetization:
    enabled: true
    default_currency: "USD"
    default_markup: 1.0
  model_armor:
    enabled: true
    location: "global"
    template: "ai-gateway-filter"


  llm_judge:
    enabled: true
    classifier_model: "gemini-3.1-flash-lite"
  quotas:
    enabled: true
    # Primary window uses native API Product Quota (<UseQuotaConfigInAPIProduct>).
    # Enable secondary_window only when a dual rolling token window (e.g., 4h + 7d) is required.
    # Limits are read dynamically from API Product / Developer App custom attributes with fallback defaults.
    secondary_window:
      enabled: false
      shared_name: "llm-token-counter-secondary"
      identifier_ref: "rate_limit_client_id"
      allow_count: 1000000
      allow_ref: "verifyapikey.VA-ApiKey.apiproduct.secondary_quota_limit"
      interval: 7
      interval_ref: "verifyapikey.VA-ApiKey.apiproduct.secondary_quota_interval"
      time_unit: "day"
      time_unit_ref: "verifyapikey.VA-ApiKey.apiproduct.secondary_quota_unit"
  rate_limits:
    # Opt-in per-application burst and concurrency rate limits (both disabled by default).
    # When enabled, limits can be overridden at runtime with zero proxy redeployment via
    # API Product, Developer, or Developer App custom attributes (burst_rate / concurrency_limit).
    burst:
      enabled: false
      rate: "600pm"                        # Fallback default (<N>ps or <N>pm) when no custom attribute is set
      identifier_ref: "rate_limit_client_id"
      use_effective_count: true
    concurrency:
      enabled: false
      limit: 20                            # Fallback max simultaneous in-flight requests per application
      identifier_ref: "rate_limit_client_id"
      ttl_minutes: 1                       # Dead-man switch window (minutes) to auto-expire leaked slots on client disconnect
  cors:
    enabled: true
  auth:
    enabled: true
    allow_bearer_api_key: true             # Option 1: Allow passing Apigee API Key inside Authorization: Bearer <api-key>
    apigee_oauth:
      enabled: true                        # Option 2: Native Apigee OAuth 2.0 Token verification (<1ms L1 cache)
    agent_identity:
      enabled: false                       # Option 3: GCP Agent Identity (ya29.*) 1st-request verification + OAuth token import
      tokeninfo_url: "https://oauth2.googleapis.com/tokeninfo"
      allowed_email_suffix: ".iam.gserviceaccount.com"
      persona: "agent"
      token_ttl_ms: 3600000
    idp_opaque:
      enabled: false                       # Option 4a: Local Harness (Claude App, Copilot, CLI) with Enterprise IdP Opaque Token
      userinfo_url: "https://idp.example.com/oauth2/v1/userinfo"
      user_claim: "email"
      persona_claim: "role"
      team_claim: "department"
      quota_override_claim: "ai_quota_override"
      token_ttl_ms: 3600000
    idp_jwt:
      enabled: false                       # Option 4b: Local Harness (Claude App, Copilot, CLI) with Enterprise IdP JWT
      jwks_uri: "https://idp.example.com/oauth2/v1/keys"
      issuer: "https://idp.example.com"
      user_claim: "email"
      persona_claim: "role"
      team_claim: "department"
      quota_override_claim: "ai_quota_override"
      token_ttl_ms: 3600000
    default_persona: ""                    # Optional fallback persona if an authenticated user's role claim doesn't match
    personas:
      knowledge-worker:
        match_claims: ["knowledge-worker", "general", "business"]
        client_id: ""                      # Apigee Developer App client_id bound to the Knowledge Worker API Product
      developer:
        match_claims: ["developer", "engineering", "swe", "data-science"]
        client_id: ""                      # Apigee Developer App client_id bound to the Developer API Product
      it:
        match_claims: ["it", "platform-admin", "sre", "devops", "secops"]
        client_id: ""                      # Apigee Developer App client_id bound to the IT/Platform API Product
      agent:
        match_claims: ["agent", "service-account", "automation"]
        client_id: ""                      # Apigee Developer App client_id bound to the Autonomous Agent API Product

# ------------------------------------------------------------------------------
# Proxy Endpoints / Supported Protocols
# ------------------------------------------------------------------------------
endpoints:
  claude:
    enabled: true
    name: "claude-messages"
    base_path: "/v1/messages"
  gemini_native:
    enabled: true
    name: "gemini-native"
    base_path: "/ai-gateway"
  openai_compat:
    enabled: true
    name: "openai-compat"
    base_path: "/v1/chat/completions"
  openai_embeddings:
    enabled: true
    name: "openai-embeddings"
    base_path: "/v1/embeddings"
  models_catalog:
    enabled: true
    name: "claude-models"
    base_path: "/v1/models"

# ------------------------------------------------------------------------------
# Global Defaults
# ------------------------------------------------------------------------------
defaults:
  model: "gemini-3.5-flash"
  fallback: "gemini-3.1-flash-lite"
  target: "gemini"
  publisher: "google"
  format: "gemini"
  region: "global"

# ------------------------------------------------------------------------------
# Smart Routing Tiers & Task Mappings
# ------------------------------------------------------------------------------
routing:
  tiers:
    low: "gemini-3.1-flash-lite"
    medium: "gemini-3.5-flash"
    high: "gemini-3.1-pro-preview"
    max: "claude-sonnet-4-6"
  tasks:
    coding: "gemini-3.1-pro-preview"
    reasoning: "gemini-3.1-pro-preview"
    summarization: "gemini-3.1-flash-lite"
    simple_chat: "gemini-3.5-flash"
    classifier_model: "gemini-3.1-flash-lite"
  aliases:
    # Legacy Gemini Aliases
    "gemini-1.5-flash": "gemini-3.5-flash"
    "gemini-1.5-flash-001": "gemini-3.5-flash"
    "gemini-1.5-pro": "gemini-3.1-pro-preview"
    "gemini-1.5-pro-001": "gemini-3.1-pro-preview"
    "gemini-3.1-pro": "gemini-3.1-pro-preview"
    "gemini-3.5-flash-lite": "gemini-3.1-flash-lite"
    # Claude Aliases
    "claude-3-5-sonnet": "claude-sonnet-4-6"
    "claude-3-5-haiku": "claude-haiku-4-5"
    # OpenAI & Embedding Aliases
    "gpt-4o": "gemini-3.1-pro-preview"
    "gpt-4o-mini": "gemini-3.1-flash-lite"
    "text-embedding-3-small": "text-embedding-005"
    "text-embedding-3-large": "text-embedding-005"
    "text-embedding-ada-002": "text-embedding-005"
    "auto": "gemini-3.5-flash"
    "gateway/auto": "gemini-3.5-flash"
    "auto:judge": "gemini-3.5-flash"
    "gateway/judge": "gemini-3.5-flash"

