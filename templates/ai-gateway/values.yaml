# ==============================================================================
# Apigee AI Gateway - Declarative Values Configuration
# ==============================================================================

gateway:
  name: "ai-gateway"
  displayName: "Apigee Enterprise AI Gateway"
  description: "Enterprise AI Gateway with Smart Routing, LLM Judge, Model Armor Security, and Token Monetization"
  revision: 1
  project_id: "your-gcp-project-id"

# ------------------------------------------------------------------------------
# Feature Toggles
# ------------------------------------------------------------------------------
features:
  monetization:
    enabled: true
    enforce_apigee_wallet: false           # Opt-in: set true ONLY when Apigee Monetization Add-on + funded developer wallets are provisioned
    default_currency: "USD"
    default_markup: 1.0
  model_armor:
    enabled: false                         # Opt-in: set true once a regional Model Armor template is provisioned in your GCP project
    location: "us-central1"                # Must be a regional endpoint (e.g., us-central1, europe-west4), not "global"
    template: "ai-gw-template"             # Global fallback template (used for both request & response unless overridden)
    request_template: "ai-gw-template"     # Default user prompt sanitization template (or "none" to skip request scanning)
    response_template: "ai-gw-template"    # Default model response sanitization template (or "none" to skip response scanning)
    allow_claim_bypass: true               # Set false to block token claims from disabling Model Armor ("none") or overriding admin identity_rules
    strict_stream_sync: false              # Opt-in: set true to hold SSE batches until SMR-SanitizeModelResponse passes before socket flush
    # stream_buffer_size: 50               # Optional SSE chunk batch interval for response-phase Model Armor scanning (default: 50)
    # Optional context-aware template enforcement by Persona or Identity/Team glob pattern:
    # personas:
    #   knowledge-worker:
    #     request_template: "strict-pii-sdp-prompt"
    #     response_template: "strict-rai-response"
    #   developer:
    #     request_template: "dev-secrets-dlp-prompt"
    #     response_template: "dev-malicious-uri-response"
    #   it:
    #     template: "it-ops-standard-filter"
    #   agent:
    #     request_template: "agent-jailbreak-shield"
    #     response_template: "none"
    # identity_rules:
    #   - match: ["*@pci-vault.iam.gserviceaccount.com", "team:finance"]
    #     request_template: "pci-strict-sdp-prompt"
    #     response_template: "pci-strict-sdp-response"
    #   - match: "principal://agents.global.org-*.system.id.goog/*/reasoningEngines/public-*"
    #     request_template: "public-agent-prompt-filter"
    #     response_template: "public-agent-response-filter"

  llm_judge:
    enabled: true
    classifier_model: "gemini-3.5-flash-lite"
  circuit_breaker:
    enabled: true
    shared_name: "llm-circuit-breaker"
    error_threshold: 3                   # Trip circuit OPEN after N upstream 429/5xx errors on a primary model
    window_interval: 1                   # Rolling recovery window duration
    window_unit: "minute"                # Rolling recovery window unit (minute, hour, day)
    synchronous: true                    # Default true for immediate cross-pod 3-strike detection; set false for async L1 batching
  streaming:
    dedicated_sse_targets: false         # Opt-in (Apigee Known Issue #449012244): split TargetEndpoints into non-SSE + *-sse targets
  security:
    sanitize_upstream_errors: false      # Opt-in: set true to scrub GCP project IDs/SA emails/URLs from unrecovered upstream 4xx/5xx errors and normalize non-JSON/cross-protocol errors
  quotas:
    enabled: true
    synchronous: true                      # Default true for immediate cross-pod accuracy; set false on individual quotas to use async L1 batching (QuotaAsyncBatchUpdater)
    preflight_prompt_guard: false          # Opt-in: rejects requests in PreFlow (429) when conservative lower-bound prompt usage exceeds remaining quota
    stream_prompt_checkpoint: false        # Opt-in: checkpoints exact initial prompt tokens/spend at SSE stream start so early disconnects still account for prompt usage
    # Primary window uses auth-agnostic dynamic quota variables (primary_quota_limit / primary_quota_interval / primary_quota_unit)
    # isolated by SharedName: "llm-token-counter", Identifier: "rate_limit_client_id", and LLMModelSource: "{model}".
    # Supports either token budgets (`limit`) or Virtual USD Spend Wallets (`limit_usd`, tracked in micro-USD: $1.00 = 1,000,000).
    # Enable secondary_window only when a dual rolling window or shared Team Budget (e.g., 4h per-user + 7d team pool) is required.
    secondary_window:
      enabled: false
      synchronous: true                  # Keep true for shared team budgets so multi-pod bursts cannot overdraft shared pools during async sync windows
      shared_name: "llm-token-counter-secondary"
      identifier_ref: "secondary_quota_identifier"
      allow_count: 1000000
      # allow_usd: 100.00                  # Optional fallback team/secondary spend cap in USD (converted to micro-USD)
      allow_ref: "secondary_quota_limit"
      interval: 7
      interval_ref: "secondary_quota_interval"
      time_unit: "day"
      time_unit_ref: "secondary_quota_unit"
  rate_limits:
    # Opt-in per-application burst, prompt-token velocity, and concurrency rate limits (disabled by default).
    # When enabled, limits can be overridden at runtime with zero proxy redeployment via
    # API Product, Developer, or Developer App custom attributes (burst_rate / prompt_token_rate / concurrency_limit).
    burst:
      enabled: false
      rate: "600pm"                        # Fallback default (<N>ps or <N>pm) when no custom attribute is set
      identifier_ref: "rate_limit_client_id"
      use_effective_count: true
    prompt_tokens:
      enabled: false
      rate: "100000pm"                     # Fallback max incoming prompt tokens (<N>ps or <N>pm) when no custom attribute is set
      identifier_ref: "rate_limit_client_id"
      use_effective_count: false           # Default false for lock-free local pod throttling; set true for cross-pod sync
    concurrency:
      enabled: false
      limit: 20                            # Fallback max simultaneous in-flight requests per application
      identifier_ref: "rate_limit_client_id"
      ttl_minutes: 1                       # Dead-man switch window (minutes) to auto-expire leaked slots on client disconnect
      synchronous: true                    # Keep true for cross-pod acquire/release slot accuracy
  auth:
    enabled: true
    allow_bearer_api_key: true             # Option 1: Allow passing Apigee API Key inside Authorization: Bearer <api-key>
    apigee_oauth:
      enabled: true                        # Option 2: Native Apigee OAuth 2.0 Token verification (<1ms L1 cache)
    agent_identity:
      enabled: false                       # Option 3: Google Cloud Agents (Agent Platform SPIFFE Agent Identity & Service Accounts)
      tokeninfo_url: "https://oauth2.googleapis.com/tokeninfo"
      # allowed_trust_domain: "agents.global.org-123456789012.system.id.goog" # Required to accept Agent Platform Agent Engine SPIFFE tokens (comma-separated or glob)
      # allowed_email_suffix: "@your-gcp-project-id.iam.gserviceaccount.com"  # Defaults to "@<gateway.project_id>.iam.gserviceaccount.com" (same-project SAs only)
      # expected_audience: ""              # Optional comma-separated allowed 'aud' values on tokeninfo responses
      # required_scopes: ""                # Optional comma/space-separated required OAuth2 'scope' values (e.g. "https://www.googleapis.com/auth/cloud-platform")
      persona: "agent"
      token_ttl_ms: 3600000
    idp_opaque:
      enabled: false                       # Option 4a: Local Harness (Claude App, Copilot, CLI) with Enterprise IdP Opaque Token
      userinfo_url: "https://idp.example.com/oauth2/v1/userinfo"
      user_claim: "email"
      persona_claim: "role"
      team_claim: "department"
      quota_override_claim: "ai_quota_override"
      token_ttl_ms: 3600000
    idp_jwt:
      enabled: false                       # Option 4b: Local Harness (Claude App, Copilot, CLI) with Enterprise IdP JWT
      jwks_uri: "https://idp.example.com/oauth2/v1/keys"
      issuer: "https://idp.example.com"
      audience: "https://ai-gateway.example.com" # Required when enabled=true (single value, comma-separated list, or glob)
      algorithm: "RS256"                   # Asymmetric JWS algorithm(s): RSA family (RS256/RS384/RS512/PS256/PS384/PS512) or ECDSA family (ES256/ES384/ES512)
      user_claim: "email"
      persona_claim: "role"
      team_claim: "department"
      quota_override_claim: "ai_quota_override"
      token_ttl_ms: 3600000
    default_persona: ""                    # Optional fallback persona if an authenticated user's role claim doesn't match
    # default_client_id: ""                # Optional shared Developer App client_id fallback across all personas
    personas:
      knowledge-worker:
        match_claims: ["knowledge-worker", "general", "business"]
        client_id: ""                      # Apigee Developer App client_id (or run: bash scripts/sync-personas.sh)
        # project_id: ""                   # Optional: Route this persona's Agent Platform calls to a dedicated GCP project (overrides unpinned model project_id)
        # models: ["gemini-3.5-flash-lite", "gemini-4-hydrogen"]
        # quota:
        #   limit: 50000                   # Token budget (or use limit_usd: 5.00 for a $5.00 Virtual USD Spend Wallet)
        #   interval: 4
        #   unit: "hour"
        # team_budget:
        #   limit: 2000000                 # Shared team token pool (or use limit_usd: 100.00 for a $100.00 team USD pool)
        #   interval: 7
        #   unit: "day"
        # rate_limits:
        #   burst_rate: "60pm"
        #   concurrency_limit: 5
        # model_armor:
        #   request_template: "strict-pii-sdp-prompt"
        #   response_template: "strict-rai-response"
      developer:
        match_claims: ["developer", "engineering", "swe", "data-science"]
        client_id: ""                      # Apigee Developer App client_id bound to the Developer API Product
        # models: ["gemini-3.5-flash-lite", "gemini-4-hydrogen", "gemini-4-argon", "claude-sonnet-5-5", "claude-opus-5-5"]
        # quota:
        #   limit: 250000                  # Or use limit_usd: 25.00 (and per_model_usd: { claude-opus-5-5: 10.00 })
        #   interval: 4
        #   unit: "hour"
        #   per_model:
        #     claude-opus-5-5: 50000
        # team_budget:
        #   limit: 10000000                # Or use limit_usd: 500.00
        #   interval: 7
        #   unit: "day"
      it:
        match_claims: ["it", "platform-admin", "sre", "devops", "secops"]
        client_id: ""                      # Apigee Developer App client_id bound to the IT/Platform API Product
        # models: ["*"]
        # quota:
        #   limit: 500000
        #   interval: 4
        #   unit: "hour"
      agent:
        match_claims: ["agent", "service-account", "automation"]
        client_id: ""                      # Apigee Developer App client_id bound to the Autonomous Agent API Product
        # models: ["gemini-3.5-flash-lite", "gemini-4-hydrogen", "gemini-embedding-001"]
        # quota:
        #   limit: 1000000
        #   interval: 1
        #   unit: "day"
    # Optional Individual, Agent, or Team Exceptions (Quotas, Auto-Expiration, Team Budgets, Models, Model Armor):
    # exceptions:
    #   - match: ["alice@company.com"]
    #     quota_limit: 500000              # Or quota_limit_usd: 50.00; raises personal limit while still drawing from shared team pool
    #     # bypass_team_budget: true       # Optional emergency bypass: isolates Alice from an exhausted shared team pool
    #     expires_at: "2026-10-15T00:00:00Z" # Automatically reverts to baseline persona quota after timestamp
    #     models: ["*"]                    # Temporarily grant access to all catalog models
    #   - match: ["team:Search-Research"]
    #     team_budget_limit: 50000000      # Or team_budget_limit_usd: 1000.00; raises shared 7-day pool for the entire Search-Research team
    #     expires_at: "2026-10-31T23:59:59Z" # Optional auto-expiration for temporary department top-ups
    #   - match: ["*@pci-vault.iam.gserviceaccount.com"]
    #     quota_limit: 2000000
    #     model_armor:
    #       request_template: "pci-strict-sdp-prompt"
    #       response_template: "pci-strict-sdp-response"

# ------------------------------------------------------------------------------
# Proxy Endpoints / Supported Protocols
# ------------------------------------------------------------------------------
endpoints:
  claude:
    enabled: true
    name: "claude-messages"
    base_path: "/v1/messages"
  gemini_native:
    enabled: true
    name: "gemini-native"
    base_path: "/ai-gateway"
  openai_compat:
    enabled: true
    name: "openai-compat"
    base_path: "/v1/chat/completions"
  openai_embeddings:
    enabled: true
    name: "openai-embeddings"
    base_path: "/v1/embeddings"
  models_catalog:
    enabled: true
    name: "claude-models"
    base_path: "/v1/models"

# ------------------------------------------------------------------------------
# Global Defaults
# ------------------------------------------------------------------------------
defaults:
  model: "gemini-4-hydrogen"
  fallback: "gemini-3.5-flash-lite"
  target: "gemini"
  publisher: "google"
  format: "gemini"
  region: "global"

# ------------------------------------------------------------------------------
# Smart Routing Tiers & Task Mappings
# ------------------------------------------------------------------------------
routing:
  tiers:
    low: "gemini-3.5-flash-lite"
    medium: "gemini-4-hydrogen"
    high: "gemini-4-argon"
    max: "claude-opus-5-5"
  tasks:
    coding: "gemini-4-argon"
    reasoning: "gemini-4-argon"
    creative_writing: "claude-sonnet-5-5"
    summarization: "gemini-3.5-flash-lite"
    extraction: "gemini-3.5-flash-lite"
    simple_chat: "gemini-4-hydrogen"
  aliases:
    # Previous & Retired Gemini Generation Aliases
    "gemini-1.5-flash": "gemini-4-hydrogen"
    "gemini-1.5-flash-001": "gemini-4-hydrogen"
    "gemini-2.5-flash": "gemini-4-hydrogen"
    "gemini-2.5-flash-lite": "gemini-3.5-flash-lite"
    "gemini-3.1-flash-lite": "gemini-3.5-flash-lite"
    "gemini-3.5-flash": "gemini-4-hydrogen"
    "gemini-3.8-flash": "gemini-4-hydrogen"
    "gemini-1.5-pro": "gemini-4-argon"
    "gemini-1.5-pro-001": "gemini-4-argon"
    "gemini-2.5-pro": "gemini-4-argon"
    "gemini-3.1-pro": "gemini-4-argon"
    "gemini-3.1-pro-preview": "gemini-4-argon"
    "gemini-3.8-pro-preview": "gemini-4-argon"
    # Previous Claude Generation Aliases
    "claude-3-5-sonnet": "claude-sonnet-5-5"
    "claude-sonnet-4-6": "claude-sonnet-5-5"
    "claude-opus-4-6": "claude-opus-5-5"
    "claude-3-5-haiku": "claude-haiku-5-5"
    "claude-haiku-4-5": "claude-haiku-5-5"
    # OpenAI, Embedding & Smart Router Aliases
    "gpt-4o": "gemini-4-argon"
    "gpt-4o-mini": "gemini-3.5-flash-lite"
    "text-embedding-005": "gemini-embedding-001"
    "text-embedding-3-small": "gemini-embedding-001"
    "text-embedding-3-large": "gemini-embedding-001"
    "text-embedding-ada-002": "gemini-embedding-001"
    "auto": "gemini-4-hydrogen"
    "gateway/auto": "gemini-4-hydrogen"
    "auto:judge": "gemini-4-hydrogen"
    "gateway/judge": "gemini-4-hydrogen"

