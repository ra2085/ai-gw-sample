      Description: Anthropic & OpenAI Models API Catalog Proxy Endpoint
      FaultRules:
        {{- include "callout_abort_faultrule" . | nindent 8 }}
      {{- include "default_fault_rule_map" . | nindent 6 }}
      PreFlow:
        .name: PreFlow
        Request:
          {{- if or (not $.Values.features) (not $.Values.features.auth) (and $.Values.features.auth (ne $.Values.features.auth.enabled false)) }}
          {{- include "auth_preflow_steps" . | nindent 10 }}
          {{- end }}
          {{- if $enforceApigeeWallet }}
          - Step:
              Name: MLC-EnforceMonetizationLimits
          {{- end }}
          - Step:
              Condition: '(proxy.pathsuffix = "") or (proxy.pathsuffix = null)'
              Name: AM-NormalizePathSuffix
        Response: {}
      PostFlow:
        .name: PostFlow
        Request: {}
        Response: {}
      Flows:
        - Flow:
            .name: listModels
            Description: List available models
            Condition: (request.verb = "GET") AND ((proxy.pathsuffix = "") OR (proxy.pathsuffix = "/"))
            Request: {}
            Response:
              Step:
                Name: JS-models-endpoint
        - Flow:
            .name: retrieveModel
            Description: Retrieve model details
            Condition: request.verb = "GET"
            Request: {}
            Response:
              Step:
                Name: JS-models-endpoint
        - Flow:
            .name: unsupportedModelsMethod
            Description: Reject unsupported HTTP methods before loopback no-target
            Request:
              Step:
                Name: JS-models-endpoint
            Response: {}
      HTTPProxyConnection:
        BasePath: {{ if and $.Values.endpoints $.Values.endpoints.models_catalog }}{{ $.Values.endpoints.models_catalog.base_path | default "/v1/models" }}{{ else }}/v1/models{{ end }}
