  {{- if or (not $.Values.endpoints) (not $.Values.endpoints.openai_embeddings) (and $.Values.endpoints.openai_embeddings (ne $.Values.endpoints.openai_embeddings.enabled false)) }}
  - ProxyEndpoint:
      .name: {{ if and $.Values.endpoints $.Values.endpoints.openai_embeddings }}{{ $.Values.endpoints.openai_embeddings.name | default "openai-embeddings" }}{{ else }}openai-embeddings{{ end }}
      -Data:
        - Description: OpenAI Embeddings API Proxy Endpoint for Vertex AI and BYO Models
        - FaultRules:
            - FaultRule:
                .name: rate-limit
                -Data:
                  - Step:
                      Name: JS-format-rate-limit-error
                  - Step:
                      Name: AM-RateLimitError
                  - Condition: (fault.name = "QuotaViolation") OR (fault.name = "SpikeArrestViolation") OR (ratelimit.SA-BurstRateLimit.failed = true) OR (ratelimit.Q-ConcurrencyLimit.failed = true) OR (ratelimit.LTQ-EnforceOnly.failed = true) OR (ratelimit.LTQ-SecondaryEnforceOnly.failed = true)
            {{- if and $.Values.features $.Values.features.model_armor $.Values.features.model_armor.enabled }}
            - FaultRule:
                .name: sanitize
                -Data:
                  {{- if and $.Values.features $.Values.features.rate_limits (or (and $.Values.features.rate_limits.concurrency $.Values.features.rate_limits.concurrency.enabled) $.Values.features.rate_limits.enabled) }}
                  - Step:
                      Condition: ratelimit.Q-ConcurrencyLimit.used.count != null
                      Name: RQ-ReleaseConcurrencySlot
                  {{- end }}
                  - Step:
                      Name: JS-inject-deidentified-finding
                  - Step:
                      Name: AM-CustomError
                  - Condition: (SanitizeUserPrompt.SUP-SanitizeUserPrompt.filterMatchState = "MATCH_FOUND") OR (SanitizeModelResponse.SMR-SanitizeModelResponse.filterMatchState = "MATCH_FOUND") OR (SanitizeModelResponse.SMR-SanitizeModelResponse.sdpFilterResult.deidentifyResult.matchState = "MATCH_FOUND") OR (SanitizeUserPrompt.SUP-SanitizeUserPrompt.sdpFilterResult.deidentifyResult.matchState = "MATCH_FOUND")
            {{- end }}

        - PreFlow:
            .name: PreFlow
            Request:
              {{- if or (not $.Values.features) (not $.Values.features.auth) (and $.Values.features.auth (ne $.Values.features.auth.enabled false)) }}
              {{- include "auth_preflow_steps" . | nindent 14 }}
              {{- end }}
              {{- if and $.Values.features $.Values.features.monetization $.Values.features.monetization.enabled }}
              - Step:
                  Name: MLC-EnforceMonetizationLimits
              {{- end }}
              - Step:
                  Name: AM-NormalizePathSuffix
              - Step:
                  Name: OAS-VerifyOpenAI
              - Step:
                  Name: JS-extract-vars-openai
              - Step:
                  Name: JS-resolve-model-location
              {{- if or (not $.Values.features) (not $.Values.features.circuit_breaker) (ne $.Values.features.circuit_breaker.enabled false) }}
              {{- include "circuit_breaker_preflow_steps" . | nindent 14 }}
              {{- end }}
              {{- if and $.Values.features $.Values.features.rate_limits (or (and $.Values.features.rate_limits.burst $.Values.features.rate_limits.burst.enabled) $.Values.features.rate_limits.enabled) }}
              - Step:
                  Name: SA-BurstRateLimit
              {{- end }}
              {{- if and $.Values.features $.Values.features.quotas $.Values.features.quotas.enabled }}
              - Step:
                  Condition: apiproduct.name != null
                  Name: LTQ-EnforceOnly
              {{- if and $.Values.features.quotas.secondary_window $.Values.features.quotas.secondary_window.enabled }}
              - Step:
                  Condition: apiproduct.name != null
                  Name: LTQ-SecondaryEnforceOnly
              {{- end }}
              {{- end }}
              {{- if and $.Values.features $.Values.features.rate_limits (or (and $.Values.features.rate_limits.concurrency $.Values.features.rate_limits.concurrency.enabled) $.Values.features.rate_limits.enabled) }}
              - Step:
                  Name: Q-ConcurrencyLimit
              {{- end }}
              {{- if and $.Values.features $.Values.features.model_armor $.Values.features.model_armor.enabled }}
              - Step:
                  Condition: (model_armor_request_enabled != "false") and (extracted_prompt != null) and (extracted_prompt != "")
                  Name: SUP-SanitizeUserPrompt
              {{- end }}
            Response: {}
        - PostFlow:
            .name: PostFlow
            Request: {}
            Response:
              {{- if and $.Values.features $.Values.features.rate_limits (or (and $.Values.features.rate_limits.concurrency $.Values.features.rate_limits.concurrency.enabled) $.Values.features.rate_limits.enabled) }}
              - Step:
                  Condition: '!(stream = true) or (response.status.code >= 400)'
                  Name: RQ-ReleaseConcurrencySlot
              {{- end }}
              {{- if or (not $.Values.features) (not $.Values.features.circuit_breaker) (ne $.Values.features.circuit_breaker.enabled false) }}
              {{- include "fallback_postflow_steps" . | nindent 14 }}
              {{- end }}
              - Step:
                  Condition: '!(stream = true) and (response.status.code < 400)'
                  Name: EV-ExtractMetadataNonStreamingOpenAI
              - Step:
                  Condition: '!(stream = true) and (response.status.code < 400)'
                  Name: JS-calculate-tokens-non-streaming
              {{- if and $.Values.features $.Values.features.monetization $.Values.features.monetization.enabled }}
              - Step:
                  Condition: '!(stream = true) and (response.status.code < 400)'
                  Name: JS-calculate-monetization-cost
              {{- end }}
              - Step:
                  Condition: '!(stream = true) and (response.status.code < 400)'
                  Name: DC-CaptureTokenCountsNonStreaming
              {{- if and $.Values.features $.Values.features.quotas $.Values.features.quotas.enabled }}
              - Step:
                  Condition: (!(stream = true)) AND (response.status.code < 400) AND (usage_total_tokens != null) AND (apiproduct.name != null)
                  Name: LTQ-CountOnly
              {{- if and $.Values.features.quotas.secondary_window $.Values.features.quotas.secondary_window.enabled }}
              - Step:
                  Condition: (!(stream = true)) AND (response.status.code < 400) AND (usage_total_tokens != null) AND (apiproduct.name != null)
                  Name: LTQ-SecondaryCountOnly
              {{- end }}
              - Step:
                  Condition: '!(stream = true)'
                  Name: AM-SetQuotaHeaders
              {{- end }}
              {{- if and $.Values.features $.Values.features.monetization $.Values.features.monetization.enabled }}
              - Step:
                  Condition: '!(stream = true) and (response.status.code < 400)'
                  Name: AM-SetMonetizationHeaders
              {{- end }}
        - Flows: {}
        - HTTPProxyConnection:
            BasePath: {{ if and $.Values.endpoints $.Values.endpoints.openai_embeddings }}{{ $.Values.endpoints.openai_embeddings.base_path | default "/v1/embeddings" }}{{ else }}/v1/embeddings{{ end }}
            Properties:
              - Property:
                  .name: response.streaming.enabled
                  -Data: false
              - Property:
                  .name: api.timeout
                  -Data: 300000
        - RouteRule:
            .name: openai-custom
            Condition: route_target = "openai-custom"
            TargetEndpoint: openai-custom
        - RouteRule:
            .name: gemini-openai-compat
            TargetEndpoint: gemini-openai-compat
  {{- end }}


  {{- if or (not $.Values.endpoints) (not $.Values.endpoints.models_catalog) (and $.Values.endpoints.models_catalog (ne $.Values.endpoints.models_catalog.enabled false)) }}
