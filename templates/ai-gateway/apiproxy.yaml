TargetEndpoints:
  {{- range $isSse := $targetVariants }}
  {{- $includePostFlow := or (not $dedicatedSseTargets) (not $isSse) }}
  {{- $includeEventFlow := or (not $dedicatedSseTargets) $isSse }}
  - TargetEndpoint:
      .name: claude{{ if $isSse }}-sse{{ end }}
      Description: Target Endpoint for Vertex Claude models{{ if $isSse }} (SSE EventFlow){{ end }}
      FaultRules:
        {{- if $modelArmorEnabled }}
        - FaultRule:
            .name: sanitize
            -Data:
              {{- if and $.Values.features $.Values.features.rate_limits (or (and $.Values.features.rate_limits.concurrency $.Values.features.rate_limits.concurrency.enabled) $.Values.features.rate_limits.enabled) }}
              - Step:
                  Condition: (ratelimit.Q-ConcurrencyLimit.used.count != null) and (apigee.metrics.policy.RQ-ReleaseConcurrencySlot.timeTaken = null)
                  Name: RQ-ReleaseConcurrencySlot
              {{- end }}
              - Step:
                  Name: JS-inject-deidentified-finding
              - Step:
                  Name: AM-CustomError
              - Condition: (SanitizeModelResponse.SMR-SanitizeModelResponse.filterMatchState = "MATCH_FOUND") or (SanitizeModelResponse.SMR-SanitizeModelResponse.sdpFilterResult.deidentifyResult.matchState = "MATCH_FOUND")
        {{- end }}
        {{- include "callout_abort_faultrule" $ | nindent 8 }}
        {{- include "target_transport_fallback_faultrule" $ | nindent 8 }}
      {{- include "default_fault_rule_map" $ | nindent 6 }}

      PreFlow:
        .name: PreFlow
        Request:
          - Step:
              Name: AM-DisablePathSuffixCopy
          - Step:
              Name: JS-inject-anthropic-version
        Response: {}
      PostFlow:
        .name: PostFlow
        Request: {}
        {{- if $includePostFlow }}
        Response:
          - Step:
              Condition: '!(stream = true) and (response.status.code < 400) and request_format = "openai"'
              Name: JS-anthropic-to-openai-resp
        {{- else }}
        Response: {}
        {{- end }}

      Flows: {}
      {{- if $includeEventFlow }}
      EventFlow:
        .name: EventFlow
        .content-type: text/event-stream
        Response:
          - Step:
              Name: JS-combine-resp
          {{- if and $.Values.features $.Values.features.rate_limits (or (and $.Values.features.rate_limits.concurrency $.Values.features.rate_limits.concurrency.enabled) $.Values.features.rate_limits.enabled) (not (and $secondaryQuotaEnabled $modelArmorEnabled)) }}
          - Step:
              Condition: (release_concurrency_slot = "true") and (ratelimit.Q-ConcurrencyLimit.used.count != null) and (apigee.metrics.policy.RQ-ReleaseConcurrencySlot.timeTaken = null)
              Name: RQ-ReleaseConcurrencySlot
          {{- end }}
          - Step:
              Condition: usage_total_tokens != null
              Name: DC-CaptureTokenCountsStreaming
          {{- if $quotasEnabled }}
          - Step:
              Condition: (primary_quota_usage != null) and (primary_quota_usage != "0") and (apiproduct.name != null)
              Name: LTQ-CountOnly
          {{- if $secondaryQuotaEnabled }}
          - Step:
              Condition: (secondary_quota_usage != null) and (secondary_quota_usage != "0") and (apiproduct.name != null)
              Name: LTQ-SecondaryCountOnly
          {{- end }}
          {{- end }}
          {{- if $modelArmorEnabled }}
          - Step:
              Condition: (model_armor_response_enabled != "false") and (buff_ready = "true") and (response_partial != null) and (response_partial != "")
              Name: SMR-SanitizeModelResponse
          {{- end }}
      {{- end }}
      HTTPTargetConnection:
        Properties:
          - Property:
              .name: connect.timeout.millis
              -Data: 5000
          - Property:
              .name: io.timeout.millis
              -Data: 300000
          - Property:
              .name: keepalive.timeout.millis
              -Data: 50000
          - Property:
              .name: success.codes
              -Data: 1xx,2xx,3xx,4xx,5xx
        SSLInfo:
          Enabled: true
          Enforce: true
          IgnoreValidationErrors: false
        Authentication:
          GoogleAccessToken:
            Scopes:
              Scope: https://www.googleapis.com/auth/cloud-platform
        URL: https://{endpoint_host}/v1/projects/{gcp_project_id}/locations/{model_location}/publishers/anthropic/models/{model}:streamRawPredict
  {{- end }}

  {{- range $isSse := $targetVariants }}
  {{- $includeEventFlow := or (not $dedicatedSseTargets) $isSse }}
  - TargetEndpoint:
      .name: gemini-native-target{{ if $isSse }}-sse{{ end }}
      Description: Target Endpoint for native Gemini requests{{ if $isSse }} (SSE EventFlow){{ end }}
      FaultRules:
