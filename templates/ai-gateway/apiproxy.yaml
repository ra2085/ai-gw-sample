              {{- if and $.Values.features.quotas.secondary_window $.Values.features.quotas.secondary_window.enabled }}
              - Step:
                  Condition: apiproduct.name != null
                  Name: LTQ-SecondaryEnforceOnly
              {{- end }}
              {{- end }}
              {{- if and $.Values.features $.Values.features.rate_limits (or (and $.Values.features.rate_limits.concurrency $.Values.features.rate_limits.concurrency.enabled) $.Values.features.rate_limits.enabled) }}
              - Step:
                  Name: Q-ConcurrencyLimit
              {{- end }}
              {{- if and $.Values.features $.Values.features.model_armor $.Values.features.model_armor.enabled }}
              - Step:
                  Condition: (model_armor_request_enabled != "false") and (request_format = "gemini") and (gemini_text_prompt != null) and (gemini_text_prompt != "")
                  Name: SUP-SanitizeUserPromptGemini
              - Step:
                  Condition: (model_armor_request_enabled != "false") and (request_format = "claude") and (extracted_prompt != null) and (extracted_prompt != "")
                  Name: SUP-SanitizeUserPrompt
              {{- end }}
            Response: {}
        - PostFlow:
            .name: PostFlow
            Request: {}
            Response:
              {{- if and $.Values.features $.Values.features.rate_limits (or (and $.Values.features.rate_limits.concurrency $.Values.features.rate_limits.concurrency.enabled) $.Values.features.rate_limits.enabled) }}
              - Step:
                  Condition: '!(stream = true) or (response.status.code >= 400)'
                  Name: RQ-ReleaseConcurrencySlot
              {{- end }}
              {{- if or (not $.Values.features) (not $.Values.features.circuit_breaker) (ne $.Values.features.circuit_breaker.enabled false) }}
              {{- include "fallback_postflow_steps" . | nindent 14 }}
              {{- end }}
              - Step:
                  Condition: '!(stream = true) and (response.status.code < 400) and request_format = "gemini"'
                  Name: EV-ExtractMetadataNonStreamingGemini
              - Step:
                  Condition: '!(stream = true) and (response.status.code < 400) and request_format = "claude"'
                  Name: EV-ExtractMetadataNonStreaming
              - Step:
                  Condition: '!(stream = true) and (response.status.code < 400)'
                  Name: JS-calculate-tokens-non-streaming
              {{- if and $.Values.features $.Values.features.model_armor $.Values.features.model_armor.enabled }}
              - Step:
                  Condition: '!(stream = true) and (response.status.code < 400) and (model_armor_response_enabled != "false") and (response_partial != null) and (response_partial != "")'
                  Name: SMR-SanitizeModelResponse
              {{- end }}
              {{- if and $.Values.features $.Values.features.monetization $.Values.features.monetization.enabled }}
              - Step:
                  Condition: '!(stream = true) and (response.status.code < 400)'
                  Name: JS-calculate-monetization-cost
              {{- end }}
              - Step:
                  Condition: '!(stream = true) and (response.status.code < 400)'
                  Name: DC-CaptureTokenCountsNonStreaming
