              - Step:
                  Condition: (!(stream = true)) AND (response.status.code < 400) AND (usage_total_tokens != null) AND (apiproduct.name != null)
                  Name: LTQ-CountOnly
              {{- if and $.Values.features.quotas.secondary_window $.Values.features.quotas.secondary_window.enabled }}
              - Step:
                  Condition: (!(stream = true)) AND (response.status.code < 400) AND (usage_total_tokens != null) AND (apiproduct.name != null)
