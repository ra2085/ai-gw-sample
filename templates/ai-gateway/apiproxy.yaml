APIProxy:
  .revision: {{ $.Values.gateway.revision | default 1 }}
  .name: {{ $.Values.gateway.name | default "ai-gateway" }}
  DisplayName: {{ $.Values.gateway.displayName | default "Apigee Enterprise AI Gateway" }}
  Description: |-
    {{ $.Values.gateway.description | default "Apigee Enterprise AI Gateway" | nindent 4 }}

Policies: {{ include "./policies.yaml" . | nindent 2 }}

ProxyEndpoints:
  {{- if or (not $.Values.endpoints) (not $.Values.endpoints.claude) (and $.Values.endpoints.claude (ne $.Values.endpoints.claude.enabled false)) }}
  - ProxyEndpoint:
      .name: {{ if and $.Values.endpoints $.Values.endpoints.claude }}{{ $.Values.endpoints.claude.name | default "claude-messages" }}{{ else }}claude-messages{{ end }}
      -Data:
        - Description: Anthropic Claude Messages Proxy Endpoint
        {{- if and $.Values.features $.Values.features.model_armor $.Values.features.model_armor.enabled }}
        - FaultRules:
            FaultRule:
              .name: sanitize
              -Data:
                - Step:
                    Name: JS-inject-deidentified-finding
                - Step:
                    Name: AM-CustomError
                - Condition: (SanitizeUserPrompt.SUP-SanitizeUserPrompt.filterMatchState  = "MATCH_FOUND") OR (SanitizeModelResponse.SMR-SanitizeModelResponse.sdpFilterResult.deidentifyResult.matchState = "MATCH_FOUND") OR (SanitizeUserPrompt.SUP-SanitizeUserPrompt.sdpFilterResult.deidentifyResult.matchState = "MATCH_FOUND")
        {{- end }}

        - PreFlow:
            .name: PreFlow
            Request:
              {{- if or (not $.Values.features) (not $.Values.features.auth) (and $.Values.features.auth (ne $.Values.features.auth.enabled false)) }}
              - Step:
                  Condition: '!(request.header.Authorization Matches "Bearer *")'
                  Name: VA-ApiKey
              {{- end }}
              {{- if and $.Values.features $.Values.features.monetization $.Values.features.monetization.enabled }}
              - Step:
                  Name: MLC-EnforceMonetizationLimits
              {{- end }}
              - Step:
                  Name: AM-NormalizePathSuffix
              - Step:
                  Name: OAS-VerifyClaude
              - Step:
                  Name: EV-Model
              {{- if and $.Values.features $.Values.features.llm_judge $.Values.features.llm_judge.enabled }}
              - Step:
                  Condition: (request.header.X-Gateway-Judge = "true") or (request.header.x-enable-judge = "true") or (model = "auto:judge") or (model = "gateway/judge") or (request.content Matches "*judge*")
                  Name: JS-prepare-judge-request
              - Step:
                  Condition: trigger_judge = "true"
                  Name: SC-LLMJudge
              - Step:
                  Condition: trigger_judge = "true"
                  Name: JS-process-judge-response
              {{- end }}
              - Step:
                  Name: JS-resolve-model-location
              {{- if and $.Values.features $.Values.features.quotas $.Values.features.quotas.enabled }}
              - Step:
                  Condition: apiproduct.name != null
                  Name: LTQ-EnforceOnly
              {{- end }}
              - Step:
                  Name: JS-extract-prompt
              {{- if and $.Values.features $.Values.features.model_armor $.Values.features.model_armor.enabled }}
              - Step:
                  Name: SUP-SanitizeUserPrompt
              {{- end }}
            Response: {}
        - PostFlow:
            .name: PostFlow
            Request: {}
            Response:
              - Step:
                  Condition: '!(stream = true)'
                  Name: EV-ExtractMetadataNonStreaming
              - Step:
                  Condition: '!(stream = true)'
                  Name: JS-calculate-tokens-non-streaming
              {{- if and $.Values.features $.Values.features.monetization $.Values.features.monetization.enabled }}
              - Step:
                  Condition: '!(stream = true)'
                  Name: JS-calculate-monetization-cost
              {{- end }}
              - Step:
                  Condition: '!(stream = true)'
                  Name: DC-CaptureTokenCountsNonStreaming
              {{- if and $.Values.features $.Values.features.quotas $.Values.features.quotas.enabled }}
              - Step:
                  Condition: (!(stream = true)) AND (usage_total_tokens != null) AND (apiproduct.name != null)
                  Name: LTQ-CountOnly
              - Step:
                  Condition: '!(stream = true)'
                  Name: AM-SetQuotaHeaders
              {{- end }}
              {{- if and $.Values.features $.Values.features.monetization $.Values.features.monetization.enabled }}
              - Step:
                  Condition: '!(stream = true)'
                  Name: AM-SetMonetizationHeaders
              {{- end }}
        - Flows: {}
        - HTTPProxyConnection:
            BasePath: {{ if and $.Values.endpoints $.Values.endpoints.claude }}{{ $.Values.endpoints.claude.base_path | default "/v1/messages" }}{{ else }}/v1/messages{{ end }}

            Properties:
              - Property:
                  .name: response.streaming.enabled
                  -Data: true
              - Property:
                  .name: api.timeout
                  -Data: 300000
        - RouteRule:
            .name: claude
            Condition: route_target = "claude"
            TargetEndpoint: claude
        - RouteRule:
            .name: gemini
            TargetEndpoint: gemini
  {{- end }}

  {{- if or (not $.Values.endpoints) (not $.Values.endpoints.gemini_native) (and $.Values.endpoints.gemini_native (ne $.Values.endpoints.gemini_native.enabled false)) }}
  - ProxyEndpoint:
      .name: {{ if and $.Values.endpoints $.Values.endpoints.gemini_native }}{{ $.Values.endpoints.gemini_native.name | default "gemini-native" }}{{ else }}gemini-native{{ end }}
      -Data:
        - Description: Native Gemini API Proxy Endpoint compatible with ADK
        {{- if and $.Values.features $.Values.features.model_armor $.Values.features.model_armor.enabled }}
        - FaultRules:
            FaultRule:
              .name: sanitize
              -Data:
                - Step:
                    Name: JS-inject-deidentified-finding
                - Step:
                    Name: AM-CustomError
                - Condition: (SanitizeUserPrompt.SUP-SanitizeUserPrompt.filterMatchState  = "MATCH_FOUND") OR (SanitizeModelResponse.SMR-SanitizeModelResponse.sdpFilterResult.deidentifyResult.matchState = "MATCH_FOUND") OR (SanitizeUserPrompt.SUP-SanitizeUserPrompt.sdpFilterResult.deidentifyResult.matchState = "MATCH_FOUND") OR (SanitizeUserPrompt.SUP-SanitizeUserPromptGemini.filterMatchState = "MATCH_FOUND") OR (SanitizeUserPrompt.SUP-SanitizeUserPromptGemini.sdpFilterResult.deidentifyResult.matchState = "MATCH_FOUND")
        {{- end }}

        - PreFlow:
            .name: PreFlow
            Request:
              {{- if or (not $.Values.features) (not $.Values.features.auth) (and $.Values.features.auth (ne $.Values.features.auth.enabled false)) }}
              - Step:
                  Condition: '!(request.header.Authorization Matches "Bearer *")'
                  Name: VA-ApiKey
              {{- end }}
              {{- if and $.Values.features $.Values.features.monetization $.Values.features.monetization.enabled }}
              - Step:
                  Name: MLC-EnforceMonetizationLimits
              {{- end }}
              - Step:
                  Name: OAS-VerifyGemini
              - Step:
                  Name: JS-extract-vars-gemini
              {{- if and $.Values.features $.Values.features.llm_judge $.Values.features.llm_judge.enabled }}
              - Step:
                  Condition: (request.header.X-Gateway-Judge = "true") or (request.header.x-enable-judge = "true") or (model = "auto:judge") or (model = "gateway/judge") or (request.content Matches "*judge*")
                  Name: JS-prepare-judge-request
              - Step:
                  Condition: trigger_judge = "true"
                  Name: SC-LLMJudge
              - Step:
                  Condition: trigger_judge = "true"
                  Name: JS-process-judge-response
              {{- end }}
              - Step:
                  Name: JS-resolve-model-location
              {{- if and $.Values.features $.Values.features.quotas $.Values.features.quotas.enabled }}
              - Step:
                  Condition: apiproduct.name != null
                  Name: LTQ-EnforceOnly
              {{- end }}
              {{- if and $.Values.features $.Values.features.model_armor $.Values.features.model_armor.enabled }}
              - Step:
                  Condition: request_format = "gemini" and gemini_text_prompt != null and gemini_text_prompt != ""
                  Name: SUP-SanitizeUserPromptGemini
              - Step:
                  Condition: request_format = "claude" and extracted_prompt != null and extracted_prompt != ""
                  Name: SUP-SanitizeUserPrompt
              {{- end }}
            Response: {}
        - PostFlow:
            .name: PostFlow
            Request: {}
            Response:
              - Step:
                  Condition: '!(stream = true) and request_format = "gemini"'
                  Name: EV-ExtractMetadataNonStreamingGemini
              - Step:
                  Condition: '!(stream = true) and request_format = "claude"'
                  Name: EV-ExtractMetadataNonStreaming
              - Step:
                  Condition: '!(stream = true)'
                  Name: JS-calculate-tokens-non-streaming
              {{- if and $.Values.features $.Values.features.monetization $.Values.features.monetization.enabled }}
              - Step:
                  Condition: '!(stream = true)'
                  Name: JS-calculate-monetization-cost
              {{- end }}
              - Step:
                  Condition: '!(stream = true)'
                  Name: DC-CaptureTokenCountsNonStreaming
              {{- if and $.Values.features $.Values.features.quotas $.Values.features.quotas.enabled }}
              - Step:
                  Condition: (!(stream = true)) AND (usage_total_tokens != null) AND (apiproduct.name != null)
                  Name: LTQ-CountOnly
              - Step:
                  Condition: '!(stream = true)'
                  Name: AM-SetQuotaHeaders
              {{- end }}
              {{- if and $.Values.features $.Values.features.monetization $.Values.features.monetization.enabled }}
              - Step:
                  Condition: '!(stream = true)'
                  Name: AM-SetMonetizationHeaders
              {{- end }}
        - Flows: {}
        - HTTPProxyConnection:
            BasePath: {{ if and $.Values.endpoints $.Values.endpoints.gemini_native }}{{ $.Values.endpoints.gemini_native.base_path | default "/ai-gateway" }}{{ else }}/ai-gateway{{ end }}
            Properties:
              - Property:
                  .name: response.streaming.enabled
                  -Data: true
              - Property:
                  .name: api.timeout
                  -Data: 300000
        - RouteRule:
            - .name: claude
              -Data:
                - TargetEndpoint: claude
                - Condition: route_target = "claude" or proxy.pathsuffix MatchesPath "/v1/projects/*/locations/*/publishers/anthropic/models/*"
            - .name: gemini-native-target
              -Data:
                - TargetEndpoint: gemini-native-target
  {{- end }}

  {{- if or (not $.Values.endpoints) (not $.Values.endpoints.openai_compat) (and $.Values.endpoints.openai_compat (ne $.Values.endpoints.openai_compat.enabled false)) }}
  - ProxyEndpoint:
      .name: {{ if and $.Values.endpoints $.Values.endpoints.openai_compat }}{{ $.Values.endpoints.openai_compat.name | default "openai-compat" }}{{ else }}openai-compat{{ end }}
      -Data:
        - Description: OpenAI Compatibility API Proxy Endpoint for Gemini
        {{- if and $.Values.features $.Values.features.model_armor $.Values.features.model_armor.enabled }}
        - FaultRules:
            FaultRule:
              .name: sanitize
              -Data:
                - Step:
                    Name: JS-inject-deidentified-finding
                - Step:
                    Name: AM-CustomError
                - Condition: (SanitizeUserPrompt.SUP-SanitizeUserPrompt.filterMatchState  = "MATCH_FOUND") OR (SanitizeModelResponse.SMR-SanitizeModelResponse.sdpFilterResult.deidentifyResult.matchState = "MATCH_FOUND") OR (SanitizeUserPrompt.SUP-SanitizeUserPrompt.sdpFilterResult.deidentifyResult.matchState = "MATCH_FOUND")
        {{- end }}

        - PreFlow:
            .name: PreFlow
            Request:
              {{- if or (not $.Values.features) (not $.Values.features.auth) (and $.Values.features.auth (ne $.Values.features.auth.enabled false)) }}
              - Step:
                  Condition: '!(request.header.Authorization Matches "Bearer *")'
                  Name: VA-ApiKey
              {{- end }}
              {{- if and $.Values.features $.Values.features.monetization $.Values.features.monetization.enabled }}
              - Step:
                  Name: MLC-EnforceMonetizationLimits
              {{- end }}
              - Step:
                  Name: AM-NormalizePathSuffix
              - Step:
                  Name: OAS-VerifyOpenAI
              - Step:
                  Name: JS-extract-vars-openai
              {{- if and $.Values.features $.Values.features.llm_judge $.Values.features.llm_judge.enabled }}
              - Step:
                  Condition: (request.header.X-Gateway-Judge = "true") or (request.header.x-enable-judge = "true") or (model = "auto:judge") or (model = "gateway/judge") or (request.content Matches "*judge*")
                  Name: JS-prepare-judge-request
              - Step:
                  Condition: trigger_judge = "true"
                  Name: SC-LLMJudge
              - Step:
                  Condition: trigger_judge = "true"
                  Name: JS-process-judge-response
              {{- end }}
              - Step:
                  Name: JS-resolve-model-location
              {{- if and $.Values.features $.Values.features.quotas $.Values.features.quotas.enabled }}
              - Step:
                  Condition: apiproduct.name != null
                  Name: LTQ-EnforceOnly
              {{- end }}
              {{- if and $.Values.features $.Values.features.model_armor $.Values.features.model_armor.enabled }}
              - Step:
                  Condition: extracted_prompt != null and extracted_prompt != ""
                  Name: SUP-SanitizeUserPrompt
              {{- end }}
            Response: {}
        - PostFlow:
            .name: PostFlow
            Request: {}
            Response:
              - Step:
                  Condition: '!(stream = true)'
                  Name: EV-ExtractMetadataNonStreamingOpenAI
              - Step:
                  Condition: '!(stream = true)'
                  Name: JS-calculate-tokens-non-streaming
              {{- if and $.Values.features $.Values.features.monetization $.Values.features.monetization.enabled }}
              - Step:
                  Condition: '!(stream = true)'
                  Name: JS-calculate-monetization-cost
              {{- end }}
              - Step:
                  Condition: '!(stream = true)'
                  Name: DC-CaptureTokenCountsNonStreaming
              {{- if and $.Values.features $.Values.features.quotas $.Values.features.quotas.enabled }}
              - Step:
                  Condition: (!(stream = true)) AND (usage_total_tokens != null) AND (apiproduct.name != null)
                  Name: LTQ-CountOnly
              - Step:
                  Condition: '!(stream = true)'
                  Name: AM-SetQuotaHeaders
              {{- end }}
              {{- if and $.Values.features $.Values.features.monetization $.Values.features.monetization.enabled }}
              - Step:
                  Condition: '!(stream = true)'
                  Name: AM-SetMonetizationHeaders
              {{- end }}
        - Flows: {}
        - HTTPProxyConnection:
            BasePath: {{ if and $.Values.endpoints $.Values.endpoints.openai_compat }}{{ $.Values.endpoints.openai_compat.base_path | default "/v1/chat/completions" }}{{ else }}/v1/chat/completions{{ end }}
            Properties:
              - Property:
                  .name: response.streaming.enabled
                  -Data: true
              - Property:
                  .name: api.timeout
                  -Data: 300000
        - RouteRule:
            - .name: claude
              -Data:
                - TargetEndpoint: claude
                - Condition: (route_target = "claude") or (route_format = "anthropic")
        - RouteRule:
            - .name: gemini-openai-compat
              -Data:
                - TargetEndpoint: gemini-openai-compat
  {{- end }}


  {{- if or (not $.Values.endpoints) (not $.Values.endpoints.models_catalog) (and $.Values.endpoints.models_catalog (ne $.Values.endpoints.models_catalog.enabled false)) }}
  - ProxyEndpoint:
      .name: {{ if and $.Values.endpoints $.Values.endpoints.models_catalog }}{{ $.Values.endpoints.models_catalog.name | default "claude-models" }}{{ else }}claude-models{{ end }}
      Description: Anthropic & OpenAI Models API Catalog Proxy Endpoint
      FaultRules: {}
      PreFlow:
        .name: PreFlow
        Request:
          {{- if or (not $.Values.features) (not $.Values.features.auth) (and $.Values.features.auth (ne $.Values.features.auth.enabled false)) }}
          - Step:
              Condition: '!(request.header.Authorization Matches "Bearer *")'
              Name: VA-ApiKey
          {{- end }}
          {{- if and $.Values.features $.Values.features.monetization $.Values.features.monetization.enabled }}
          - Step:
              Name: MLC-EnforceMonetizationLimits
          {{- end }}
          - Step:
              Name: AM-NormalizePathSuffix
        Response: {}
      PostFlow:
        .name: PostFlow
        Request: {}
        Response: {}
      Flows:
        - Flow:
            .name: listModels
            Description: List available models
            Condition: (request.verb = "GET") AND ((proxy.pathsuffix MatchesPath "") OR (proxy.pathsuffix MatchesPath "/"))
            Request: {}
            Response:
              Step:
                Name: JS-models-endpoint
        - Flow:
            .name: retrieveModel
            Description: Retrieve model details
            Condition: (request.verb = "GET") AND (proxy.pathsuffix MatchesPath "/*")
            Request: {}
            Response:
              Step:
                Name: JS-models-endpoint
      HTTPProxyConnection:
        BasePath: {{ if and $.Values.endpoints $.Values.endpoints.models_catalog }}{{ $.Values.endpoints.models_catalog.base_path | default "/v1/models" }}{{ else }}/v1/models{{ end }}
      RouteRule:
        .name: no-target
  {{- end }}


TargetEndpoints:
  - TargetEndpoint:
      .name: claude
      Description: Target Endpoint for Vertex Claude models
      {{- if $.Values.features.model_armor.enabled }}
      FaultRules:
        FaultRule:
          .name: sanitize
          -Data:
            - Step:
                Name: JS-inject-deidentified-finding
            - Step:
                Name: AM-CustomError
            - Condition: (SanitizeUserPrompt.SUP-SanitizeUserPrompt.filterMatchState  = "MATCH_FOUND") or (SanitizeModelResponse.SMR-SanitizeModelResponse.sdpFilterResult.deidentifyResult.matchState = "MATCH_FOUND") or (SanitizeUserPrompt.SUP-SanitizeUserPrompt.sdpFilterResult.deidentifyResult.matchState = "MATCH_FOUND")
      {{- end }}

      PreFlow:
        .name: PreFlow
        Request:
          - Step:
              Name: AM-DisablePathSuffixCopy
          - Step:
              Name: JS-inject-anthropic-version
        Response: {}
      PostFlow:
        .name: PostFlow
        Request: {}
        Response:
          - Step:
              Condition: '!(stream = true) and request_format = "openai"'
              Name: JS-anthropic-to-openai-resp

      Flows: {}
      EventFlow:
        .name: EventFlow
        .content-type: text/event-stream
        Response:
          - Step:
              Name: JS-combine-resp
          {{- if $.Values.features.monetization.enabled }}
          - Step:
              Condition: usage_total_tokens != null
              Name: JS-calculate-monetization-cost
          {{- end }}
          - Step:
              Condition: usage_total_tokens != null
              Name: DC-CaptureTokenCountsStreaming
          {{- if $.Values.features.quotas.enabled }}
          - Step:
              Condition: usage_total_tokens != null and apiproduct.name != null
              Name: LTQ-CountOnly
          {{- end }}
          {{- if $.Values.features.model_armor.enabled }}
          - Step:
              Condition: buff_ready = "true" and response_partial != null and response_partial != ""
              Name: SMR-SanitizeModelResponse
          {{- end }}
      HTTPTargetConnection:
        Properties:
          Property:
            .name: io.timeout.millis
            -Data: 300000
        Authentication:
          GoogleAccessToken:
            Scopes:
              Scope: https://www.googleapis.com/auth/cloud-platform
        URL: https://{endpoint_host}/v1/projects/{propertyset.config.project_id}/locations/{model_location}/publishers/anthropic/models/{model}:streamRawPredict

  - TargetEndpoint:
      .name: gemini-native-target
      Description: Target Endpoint for native Gemini requests
      {{- if $.Values.features.model_armor.enabled }}
      FaultRules:
        FaultRule:
          .name: sanitize
          -Data:
            - Step:
                Name: JS-inject-deidentified-finding
            - Step:
                Name: AM-CustomError
            - Condition: (SanitizeUserPrompt.SUP-SanitizeUserPrompt.filterMatchState  = "MATCH_FOUND") or (SanitizeModelResponse.SMR-SanitizeModelResponse.sdpFilterResult.deidentifyResult.matchState = "MATCH_FOUND") or (SanitizeUserPrompt.SUP-SanitizeUserPrompt.sdpFilterResult.deidentifyResult.matchState = "MATCH_FOUND") or (SanitizeUserPrompt.SUP-SanitizeUserPromptGemini.filterMatchState = "MATCH_FOUND") or (SanitizeUserPrompt.SUP-SanitizeUserPromptGemini.sdpFilterResult.deidentifyResult.matchState = "MATCH_FOUND")
      {{- end }}
      PreFlow:
        .name: PreFlow
        Request: {}
        Response: {}
        Response: {}
      PostFlow:
        .name: PostFlow
        Request: {}
        Response: {}
      Flows: {}
      EventFlow:
        .name: EventFlow
        .content-type: text/event-stream
        Response:
          - Step:
              Name: JS-combine-resp
          {{- if $.Values.features.monetization.enabled }}
          - Step:
              Condition: usage_total_tokens != null
              Name: JS-calculate-monetization-cost
          {{- end }}
          - Step:
              Condition: usage_total_tokens != null
              Name: DC-CaptureTokenCountsStreaming
          {{- if $.Values.features.quotas.enabled }}
          - Step:
              Condition: usage_total_tokens != null and apiproduct.name != null
              Name: LTQ-CountOnly
          {{- end }}
          {{- if $.Values.features.model_armor.enabled }}
          - Step:
              Condition: buff_ready = "true" and response_partial != null and response_partial != ""
              Name: SMR-SanitizeModelResponse
          {{- end }}
      HTTPTargetConnection:
        Properties:
          Property:
            .name: io.timeout.millis
            -Data: 300000
        Authentication:
          GoogleAccessToken:
            Scopes:
              Scope: https://www.googleapis.com/auth/cloud-platform
        URL: https://aiplatform.googleapis.com

  - TargetEndpoint:
      .name: gemini-openai-compat
      Description: Target Endpoint for OpenAI-compatible Gemini requests
      {{- if $.Values.features.model_armor.enabled }}
      FaultRules:
        FaultRule:
          .name: sanitize
          -Data:
            - Step:
                Name: JS-inject-deidentified-finding
            - Step:
                Name: AM-CustomError
            - Condition: (SanitizeUserPrompt.SUP-SanitizeUserPrompt.filterMatchState  = "MATCH_FOUND") or (SanitizeModelResponse.SMR-SanitizeModelResponse.sdpFilterResult.deidentifyResult.matchState = "MATCH_FOUND") or (SanitizeUserPrompt.SUP-SanitizeUserPrompt.sdpFilterResult.deidentifyResult.matchState = "MATCH_FOUND")
      {{- end }}
      PreFlow:
        .name: PreFlow
        Request:
          - Step:
              Name: AM-DisablePathSuffixCopy
          - Step:
              Name: JS-restore-model-openai
        Response: {}
      PostFlow:
        .name: PostFlow
        Request: {}
        Response: {}
      Flows: {}
      EventFlow:
        .name: EventFlow
        .content-type: text/event-stream
        Response:
          - Step:
              Name: JS-combine-resp
          {{- if $.Values.features.monetization.enabled }}
          - Step:
              Condition: usage_total_tokens != null
              Name: JS-calculate-monetization-cost
          {{- end }}
          - Step:
              Condition: usage_total_tokens != null
              Name: DC-CaptureTokenCountsStreaming
          {{- if $.Values.features.quotas.enabled }}
          - Step:
              Condition: usage_total_tokens != null and apiproduct.name != null
              Name: LTQ-CountOnly
          {{- end }}
          {{- if $.Values.features.model_armor.enabled }}
          - Step:
              Condition: buff_ready = "true" and response_partial != null and response_partial != ""
              Name: SMR-SanitizeModelResponse
          {{- end }}
      HTTPTargetConnection:
        Properties:
          Property:
            .name: io.timeout.millis
            -Data: 300000
        Authentication:
          GoogleAccessToken:
            Scopes:
              Scope: https://www.googleapis.com/auth/cloud-platform
        URL: https://{endpoint_host}/v1/projects/{propertyset.config.project_id}/locations/{model_location}/endpoints/openapi/chat/completions

  - TargetEndpoint:
      .name: gemini
      Description: Target Endpoint for translated Gemini requests
      {{- if $.Values.features.model_armor.enabled }}
      FaultRules:
        FaultRule:
          .name: sanitize
          -Data:
            - Step:
                Name: JS-inject-deidentified-finding
            - Step:
                Name: AM-CustomError
            - Condition: (SanitizeUserPrompt.SUP-SanitizeUserPrompt.filterMatchState  = "MATCH_FOUND") or (SanitizeModelResponse.SMR-SanitizeModelResponse.sdpFilterResult.deidentifyResult.matchState = "MATCH_FOUND") or (SanitizeUserPrompt.SUP-SanitizeUserPrompt.sdpFilterResult.deidentifyResult.matchState = "MATCH_FOUND")
      {{- end }}

      PreFlow:
        .name: PreFlow
        Request:
          Step:
            Name: AM-DisablePathSuffixCopy
        Response: {}
      PostFlow:
        .name: PostFlow
        Request:
          Step:
            Name: JS-anthropic-to-gemini
        Response:
          Step:
            Condition: '!(stream = true)'
            Name: JS-gemini-to-anthropic-resp
      Flows: {}
      EventFlow:
        .name: EventFlow
        .content-type: text/event-stream
        Response:
          - Step:
              Name: JS-combine-resp
          {{- if $.Values.features.monetization.enabled }}
          - Step:
              Condition: usage_total_tokens != null
              Name: JS-calculate-monetization-cost
          {{- end }}
          - Step:
              Condition: usage_total_tokens != null
              Name: DC-CaptureTokenCountsStreaming
          {{- if $.Values.features.quotas.enabled }}
          - Step:
              Condition: usage_total_tokens != null and apiproduct.name != null
              Name: LTQ-CountOnly
          {{- end }}
          {{- if $.Values.features.model_armor.enabled }}
          - Step:
              Condition: buff_ready = "true" and response_partial != null and response_partial != ""
              Name: SMR-SanitizeModelResponse
          {{- end }}
      HTTPTargetConnection:
        Properties:
          Property:
            .name: io.timeout.millis
            -Data: 300000
        Authentication:
          GoogleAccessToken:
            Scopes:
              Scope: https://www.googleapis.com/auth/cloud-platform
        URL: https://aiplatform.googleapis.com/v1/projects/{propertyset.config.project_id}/locations/global/publishers/google/models/{model}:generateContent

