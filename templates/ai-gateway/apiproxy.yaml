            Response:
              {{- if and $.Values.features $.Values.features.rate_limits (or (and $.Values.features.rate_limits.concurrency $.Values.features.rate_limits.concurrency.enabled) $.Values.features.rate_limits.enabled) }}
              - Step:
                  Condition: {{ if and $secondaryQuotaEnabled $modelArmorEnabled }}'(ratelimit.Q-ConcurrencyLimit.used.count != null) and (apigee.metrics.policy.RQ-ReleaseConcurrencySlot.timeTaken = null)'{{ else }}'(!(stream = true) or (response.status.code >= 400) or !(response.header.Content-Type =| "text/event-stream")) and (ratelimit.Q-ConcurrencyLimit.used.count != null) and (apigee.metrics.policy.RQ-ReleaseConcurrencySlot.timeTaken = null)'{{ end }}
                  Name: RQ-ReleaseConcurrencySlot
