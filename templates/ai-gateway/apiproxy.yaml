{{- $quotasEnabled := or (not $.Values.features) (not $.Values.features.quotas) (not (hasKey $.Values.features.quotas "enabled")) (ne (printf "%v" $.Values.features.quotas.enabled) "false") -}}
{{- $secondaryQuotaEnabled := and $quotasEnabled $.Values.features $.Values.features.quotas $.Values.features.quotas.secondary_window (eq (printf "%v" $.Values.features.quotas.secondary_window.enabled) "true") -}}
{{- $monetizationEnabled := or (not $.Values.features) (not $.Values.features.monetization) (not (hasKey $.Values.features.monetization "enabled")) (ne (printf "%v" $.Values.features.monetization.enabled) "false") -}}
{{- $enforceApigeeWallet := and $monetizationEnabled $.Values.features $.Values.features.monetization (hasKey $.Values.features.monetization "enforce_apigee_wallet") (eq (printf "%v" $.Values.features.monetization.enforce_apigee_wallet) "true") -}}
{{- $llmJudgeEnabled := or (not $.Values.features) (not $.Values.features.llm_judge) (not (hasKey $.Values.features.llm_judge "enabled")) (ne (printf "%v" $.Values.features.llm_judge.enabled) "false") -}}
{{- $modelArmorEnabled := and $.Values.features $.Values.features.model_armor (eq (printf "%v" $.Values.features.model_armor.enabled) "true") -}}
{{- $promptTokenLimitEnabled := and $.Values.features $.Values.features.rate_limits $.Values.features.rate_limits.prompt_tokens (eq (printf "%v" $.Values.features.rate_limits.prompt_tokens.enabled) "true") -}}
{{- $dedicatedSseTargets := and $.Values.features $.Values.features.streaming (eq (printf "%v" $.Values.features.streaming.dedicated_sse_targets) "true") -}}
{{- $targetVariants := list false -}}
{{- if $dedicatedSseTargets -}}
  {{- $targetVariants = list false true -}}
{{- end -}}
APIProxy:
  .revision: {{ $.Values.gateway.revision | default 1 }}
  .name: {{ $.Values.gateway.name | default "ai-gateway" }}
  DisplayName: {{ $.Values.gateway.displayName | default "Apigee Enterprise AI Gateway" }}
  Description: |-
    {{ $.Values.gateway.description | default "Apigee Enterprise AI Gateway" | nindent 4 }}

Policies: {{ include "./policies.yaml" . | nindent 2 }}

ProxyEndpoints:
  {{- if or (not $.Values.endpoints) (not $.Values.endpoints.claude) (and $.Values.endpoints.claude (ne $.Values.endpoints.claude.enabled false)) }}
  - ProxyEndpoint:
      .name: {{ if and $.Values.endpoints $.Values.endpoints.claude }}{{ $.Values.endpoints.claude.name | default "claude-messages" }}{{ else }}claude-messages{{ end }}
      -Data:
        - Description: Anthropic Claude Messages Proxy Endpoint
        - FaultRules:
            {{- if $modelArmorEnabled }}
            - FaultRule:
                .name: sanitize
                -Data:
                  {{- if and $.Values.features $.Values.features.rate_limits (or (and $.Values.features.rate_limits.concurrency $.Values.features.rate_limits.concurrency.enabled) $.Values.features.rate_limits.enabled) }}
                  - Step:
                      Condition: (ratelimit.Q-ConcurrencyLimit.used.count != null) and (apigee.metrics.policy.RQ-ReleaseConcurrencySlot.timeTaken = null)
                      Name: RQ-ReleaseConcurrencySlot
                  {{- end }}
                  - Step:
                      Name: JS-inject-deidentified-finding
                  - Step:
                      Name: AM-CustomError
                  - Condition: (SanitizeUserPrompt.SUP-SanitizeUserPrompt.filterMatchState = "MATCH_FOUND") OR (SanitizeModelResponse.SMR-SanitizeModelResponse.filterMatchState = "MATCH_FOUND") OR (SanitizeModelResponse.SMR-SanitizeModelResponse.sdpFilterResult.deidentifyResult.matchState = "MATCH_FOUND") OR (SanitizeUserPrompt.SUP-SanitizeUserPrompt.sdpFilterResult.deidentifyResult.matchState = "MATCH_FOUND")
            {{- end }}
            - FaultRule:
                .name: rate-limit
                -Data:
                  {{- if and $.Values.features $.Values.features.rate_limits (or (and $.Values.features.rate_limits.concurrency $.Values.features.rate_limits.concurrency.enabled) $.Values.features.rate_limits.enabled) }}
                  - Step:
                      Condition: (ratelimit.Q-ConcurrencyLimit.used.count != null) and (apigee.metrics.policy.RQ-ReleaseConcurrencySlot.timeTaken = null)
                      Name: RQ-ReleaseConcurrencySlot
                  {{- end }}
                  - Step:
                      Name: JS-format-rate-limit-error
                  - Step:
                      Name: AM-RateLimitError
                  - Condition: (fault.name = "QuotaViolation") OR (fault.name = "SpikeArrestViolation") OR (fault.name = "PromptTokenLimitViolation") OR (preflight_quota_exceeded = "true") OR (ratelimit.SA-BurstRateLimit.failed = true) OR (ratelimit.Q-ConcurrencyLimit.failed = true) OR (ratelimit.LTQ-EnforceOnly.failed = true) OR (ratelimit.LTQ-SecondaryEnforceOnly.failed = true)
            {{- include "callout_abort_faultrule" . | nindent 12 }}
        {{- include "default_fault_rule" . | nindent 8 }}

        - PreFlow:
            .name: PreFlow
            Request:
              {{- if or (not $.Values.features) (not $.Values.features.auth) (and $.Values.features.auth (ne $.Values.features.auth.enabled false)) }}
              {{- include "auth_preflow_steps" . | nindent 14 }}
              {{- end }}
              {{- if $enforceApigeeWallet }}
              - Step:
                  Name: MLC-EnforceMonetizationLimits
              {{- end }}
              - Step:
                  Condition: '(proxy.pathsuffix = "") or (proxy.pathsuffix = null)'
                  Name: AM-NormalizePathSuffix
              - Step:
                  Name: OAS-VerifyClaude
              - Step:
                  Name: JS-extract-vars-claude
              - Step:
                  Name: JS-resolve-model-location
              - Step:
                  Condition: model_access_denied = "true"
                  Name: RF-Unauthorized
              {{- if or (not $.Values.features) (not $.Values.features.circuit_breaker) (ne $.Values.features.circuit_breaker.enabled false) }}
              {{- include "circuit_breaker_preflow_steps" . | nindent 14 }}
              {{- end }}
              {{- if and $.Values.features $.Values.features.rate_limits (or (and $.Values.features.rate_limits.burst $.Values.features.rate_limits.burst.enabled) $.Values.features.rate_limits.enabled) }}
              - Step:
                  Name: SA-BurstRateLimit
              {{- end }}
              {{- if $promptTokenLimitEnabled }}
              - Step:
                  Condition: (extracted_prompt != null) and (extracted_prompt != "")
                  Name: PTL-PromptTokenLimit
              {{- end }}
              {{- if $quotasEnabled }}
              - Step:
                  Condition: '(apiproduct.name != null) and (zero_primary_quota != "true")'
                  Name: LTQ-EnforceOnly
              {{- if $secondaryQuotaEnabled }}
              - Step:
                  Condition: '(apiproduct.name != null) and (zero_primary_quota != "true") and (zero_secondary_quota != "true")'
                  Name: LTQ-SecondaryEnforceOnly
              {{- end }}
              - Step:
                  Condition: '(apiproduct.name != null) and ((zero_primary_quota = "true"){{ if $secondaryQuotaEnabled }} or (zero_secondary_quota = "true"){{ end }} or ((propertyset.config.preflight_prompt_guard = "true") and (prompt_char_len != null) and (prompt_char_len != "0")))'
                  Name: JS-resolve-model-location
              {{- end }}
              {{- if and $.Values.features $.Values.features.rate_limits (or (and $.Values.features.rate_limits.concurrency $.Values.features.rate_limits.concurrency.enabled) $.Values.features.rate_limits.enabled) }}
              - Step:
                  Name: Q-ConcurrencyLimit
              {{- end }}
              {{- if $modelArmorEnabled }}
              - Step:
                  Condition: (model_armor_request_enabled != "false") and (extracted_prompt != null) and (extracted_prompt != "")
                  Name: SUP-SanitizeUserPrompt
              {{- end }}
              {{- if $llmJudgeEnabled }}
              {{- include "judge_post_guardrail_steps" . | nindent 14 }}
              {{- end }}
            Response: {}
        - PostFlow:
            .name: PostFlow
            Request: {}
            Response:
              {{- if and $.Values.features $.Values.features.rate_limits (or (and $.Values.features.rate_limits.concurrency $.Values.features.rate_limits.concurrency.enabled) $.Values.features.rate_limits.enabled) }}
              - Step:
                  Condition: {{ if and $secondaryQuotaEnabled $modelArmorEnabled }}'(ratelimit.Q-ConcurrencyLimit.used.count != null) and (apigee.metrics.policy.RQ-ReleaseConcurrencySlot.timeTaken = null)'{{ else }}'(!(stream = true) or (response.status.code >= 400) or !(response.header.Content-Type =| "text/event-stream")) and (ratelimit.Q-ConcurrencyLimit.used.count != null) and (apigee.metrics.policy.RQ-ReleaseConcurrencySlot.timeTaken = null)'{{ end }}
                  Name: RQ-ReleaseConcurrencySlot
              {{- end }}
              {{- if or (not $.Values.features) (not $.Values.features.circuit_breaker) (ne $.Values.features.circuit_breaker.enabled false) }}
              {{- include "fallback_postflow_steps" . | nindent 14 }}
              {{- end }}
              - Step:
                  Condition: '(response.status.code >= 400) and (propertyset.config.sanitize_upstream_errors = "true") and !(response.header.Content-Type =| "text/event-stream")'
                  Name: JS-inject-deidentified-finding
              - Step:
                  Condition: '!(stream = true) and (response.status.code < 400) and (response_tokens_extracted != "true") and (vertex_predict_embeddings != "true")'
                  Name: EV-ExtractMetadataNonStreaming
              - Step:
                  Condition: '!(stream = true) and (response.status.code < 400)'
                  Name: JS-calculate-tokens-non-streaming
              {{- if $modelArmorEnabled }}
              - Step:
                  Condition: '!(stream = true) and (response.status.code < 400) and (model_armor_response_enabled != "false") and (response_partial != null) and (response_partial != "")'
                  Name: SMR-SanitizeModelResponse
              {{- end }}
              {{- if or $monetizationEnabled $quotasEnabled }}
              - Step:
                  Condition: '!(stream = true) and (response.status.code < 400)'
                  Name: JS-calculate-monetization-cost
              {{- end }}
              - Step:
                  Condition: '!(stream = true) and (response.status.code < 400)'
                  Name: DC-CaptureTokenCountsNonStreaming
              {{- if $quotasEnabled }}
              - Step:
                  Condition: (!(stream = true)) AND (response.status.code < 400) AND (((usage_total_tokens != null) AND (usage_total_tokens != "0")) OR ((judge_total_tokens != null) AND (judge_total_tokens != "0"))) AND (apiproduct.name != null)
                  Name: LTQ-CountOnly
              {{- if $secondaryQuotaEnabled }}
              - Step:
                  Condition: (!(stream = true)) AND (response.status.code < 400) AND (((usage_total_tokens != null) AND (usage_total_tokens != "0")) OR ((judge_total_tokens != null) AND (judge_total_tokens != "0"))) AND (apiproduct.name != null)
                  Name: LTQ-SecondaryCountOnly
              {{- end }}
              - Step:
                  Condition: '!(stream = true) and (response.status.code < 400)'
                  Name: AM-SetQuotaHeaders
              {{- end }}
              {{- if $monetizationEnabled }}
              - Step:
                  Condition: '!(stream = true) and (response.status.code < 400)'
                  Name: AM-SetMonetizationHeaders
              {{- end }}
        - Flows: {}
        - HTTPProxyConnection:
            BasePath: {{ if and $.Values.endpoints $.Values.endpoints.claude }}{{ $.Values.endpoints.claude.base_path | default "/v1/messages" }}{{ else }}/v1/messages{{ end }}
            Properties:
              - Property:
                  .name: api.timeout
                  -Data: 300000
        {{- if $dedicatedSseTargets }}
        - RouteRule:
            .name: openai-custom-sse
            Condition: (stream = true) and (route_target = "openai-custom")
            TargetEndpoint: openai-custom-sse
        - RouteRule:
            .name: claude-sse
            Condition: (stream = true) and (route_target = "claude")
            TargetEndpoint: claude-sse
        - RouteRule:
            .name: gemini-openai-compat-sse
            Condition: (stream = true) and ((route_target = "gemini-openai-compat") or (model_format = "openai"))
            TargetEndpoint: gemini-openai-compat-sse
        - RouteRule:
            .name: gemini-sse
            Condition: stream = true
            TargetEndpoint: gemini-sse
        {{- end }}
        - RouteRule:
            .name: openai-custom
            Condition: route_target = "openai-custom"
            TargetEndpoint: openai-custom
        - RouteRule:
            .name: claude
            Condition: route_target = "claude"
            TargetEndpoint: claude
        - RouteRule:
            .name: gemini-openai-compat
            Condition: (route_target = "gemini-openai-compat") or (model_format = "openai")
            TargetEndpoint: gemini-openai-compat
        - RouteRule:
            .name: gemini
            TargetEndpoint: gemini
  {{- end }}

  {{- if or (not $.Values.endpoints) (not $.Values.endpoints.gemini_native) (and $.Values.endpoints.gemini_native (ne $.Values.endpoints.gemini_native.enabled false)) }}
  - ProxyEndpoint:
      .name: {{ if and $.Values.endpoints $.Values.endpoints.gemini_native }}{{ $.Values.endpoints.gemini_native.name | default "gemini-native" }}{{ else }}gemini-native{{ end }}
      -Data:
        - Description: Native Gemini API Proxy Endpoint compatible with ADK
        - FaultRules:
            {{- if $modelArmorEnabled }}
            - FaultRule:
                .name: sanitize
                -Data:
                  {{- if and $.Values.features $.Values.features.rate_limits (or (and $.Values.features.rate_limits.concurrency $.Values.features.rate_limits.concurrency.enabled) $.Values.features.rate_limits.enabled) }}
                  - Step:
                      Condition: (ratelimit.Q-ConcurrencyLimit.used.count != null) and (apigee.metrics.policy.RQ-ReleaseConcurrencySlot.timeTaken = null)
                      Name: RQ-ReleaseConcurrencySlot
                  {{- end }}
                  - Step:
                      Name: JS-inject-deidentified-finding
                  - Step:
                      Name: AM-CustomError
                  - Condition: (SanitizeUserPrompt.SUP-SanitizeUserPrompt.filterMatchState = "MATCH_FOUND") OR (SanitizeModelResponse.SMR-SanitizeModelResponse.filterMatchState = "MATCH_FOUND") OR (SanitizeModelResponse.SMR-SanitizeModelResponse.sdpFilterResult.deidentifyResult.matchState = "MATCH_FOUND") OR (SanitizeUserPrompt.SUP-SanitizeUserPrompt.sdpFilterResult.deidentifyResult.matchState = "MATCH_FOUND") OR (SanitizeUserPrompt.SUP-SanitizeUserPromptGemini.filterMatchState = "MATCH_FOUND") OR (SanitizeUserPrompt.SUP-SanitizeUserPromptGemini.sdpFilterResult.deidentifyResult.matchState = "MATCH_FOUND")
            {{- end }}
            - FaultRule:
                .name: rate-limit
                -Data:
                  {{- if and $.Values.features $.Values.features.rate_limits (or (and $.Values.features.rate_limits.concurrency $.Values.features.rate_limits.concurrency.enabled) $.Values.features.rate_limits.enabled) }}
                  - Step:
                      Condition: (ratelimit.Q-ConcurrencyLimit.used.count != null) and (apigee.metrics.policy.RQ-ReleaseConcurrencySlot.timeTaken = null)
                      Name: RQ-ReleaseConcurrencySlot
                  {{- end }}
                  - Step:
                      Name: JS-format-rate-limit-error
                  - Step:
                      Name: AM-RateLimitError
                  - Condition: (fault.name = "QuotaViolation") OR (fault.name = "SpikeArrestViolation") OR (fault.name = "PromptTokenLimitViolation") OR (preflight_quota_exceeded = "true") OR (ratelimit.SA-BurstRateLimit.failed = true) OR (ratelimit.Q-ConcurrencyLimit.failed = true) OR (ratelimit.LTQ-EnforceOnly.failed = true) OR (ratelimit.LTQ-SecondaryEnforceOnly.failed = true)
            {{- include "callout_abort_faultrule" . | nindent 12 }}
        {{- include "default_fault_rule" . | nindent 8 }}

        - PreFlow:
            .name: PreFlow
            Request:
              {{- if or (not $.Values.features) (not $.Values.features.auth) (and $.Values.features.auth (ne $.Values.features.auth.enabled false)) }}
              {{- include "auth_preflow_steps" . | nindent 14 }}
              {{- end }}
              {{- if $enforceApigeeWallet }}
              - Step:
                  Name: MLC-EnforceMonetizationLimits
              {{- end }}
              - Step:
                  Name: OAS-VerifyGemini
              - Step:
                  Name: JS-extract-vars-gemini
              - Step:
                  Name: JS-resolve-model-location
              - Step:
                  Condition: model_access_denied = "true"
                  Name: RF-Unauthorized
              {{- if or (not $.Values.features) (not $.Values.features.circuit_breaker) (ne $.Values.features.circuit_breaker.enabled false) }}
              {{- include "circuit_breaker_preflow_steps" . | nindent 14 }}
              {{- end }}
              {{- if and $.Values.features $.Values.features.rate_limits (or (and $.Values.features.rate_limits.burst $.Values.features.rate_limits.burst.enabled) $.Values.features.rate_limits.enabled) }}
              - Step:
                  Name: SA-BurstRateLimit
              {{- end }}
              {{- if $promptTokenLimitEnabled }}
              - Step:
                  Condition: (extracted_prompt != null) and (extracted_prompt != "")
                  Name: PTL-PromptTokenLimit
              {{- end }}
              {{- if $quotasEnabled }}
              - Step:
                  Condition: '(apiproduct.name != null) and (zero_primary_quota != "true")'
                  Name: LTQ-EnforceOnly
              {{- if $secondaryQuotaEnabled }}
              - Step:
                  Condition: '(apiproduct.name != null) and (zero_primary_quota != "true") and (zero_secondary_quota != "true")'
                  Name: LTQ-SecondaryEnforceOnly
              {{- end }}
              - Step:
                  Condition: '(apiproduct.name != null) and ((zero_primary_quota = "true"){{ if $secondaryQuotaEnabled }} or (zero_secondary_quota = "true"){{ end }} or ((propertyset.config.preflight_prompt_guard = "true") and (prompt_char_len != null) and (prompt_char_len != "0")))'
                  Name: JS-resolve-model-location
              {{- end }}
              {{- if and $.Values.features $.Values.features.rate_limits (or (and $.Values.features.rate_limits.concurrency $.Values.features.rate_limits.concurrency.enabled) $.Values.features.rate_limits.enabled) }}
              - Step:
                  Name: Q-ConcurrencyLimit
              {{- end }}
              {{- if $modelArmorEnabled }}
              - Step:
                  Condition: (model_armor_request_enabled != "false") and (request_format = "gemini") and (gemini_text_prompt != null) and (gemini_text_prompt != "")
                  Name: SUP-SanitizeUserPromptGemini
              - Step:
                  Condition: (model_armor_request_enabled != "false") and (request_format = "claude") and (extracted_prompt != null) and (extracted_prompt != "")
                  Name: SUP-SanitizeUserPrompt
              {{- end }}
              {{- if $llmJudgeEnabled }}
              {{- include "judge_post_guardrail_steps" . | nindent 14 }}
              {{- end }}
            Response: {}
        - PostFlow:
            .name: PostFlow
            Request: {}
            Response:
              {{- if and $.Values.features $.Values.features.rate_limits (or (and $.Values.features.rate_limits.concurrency $.Values.features.rate_limits.concurrency.enabled) $.Values.features.rate_limits.enabled) }}
              - Step:
                  Condition: {{ if and $secondaryQuotaEnabled $modelArmorEnabled }}'(ratelimit.Q-ConcurrencyLimit.used.count != null) and (apigee.metrics.policy.RQ-ReleaseConcurrencySlot.timeTaken = null)'{{ else }}'(!(stream = true) or (response.status.code >= 400) or !(response.header.Content-Type =| "text/event-stream")) and (ratelimit.Q-ConcurrencyLimit.used.count != null) and (apigee.metrics.policy.RQ-ReleaseConcurrencySlot.timeTaken = null)'{{ end }}
                  Name: RQ-ReleaseConcurrencySlot
              {{- end }}
              {{- if or (not $.Values.features) (not $.Values.features.circuit_breaker) (ne $.Values.features.circuit_breaker.enabled false) }}
              {{- include "fallback_postflow_steps" . | nindent 14 }}
              {{- end }}
              - Step:
                  Condition: '(response.status.code >= 400) and (propertyset.config.sanitize_upstream_errors = "true") and !(response.header.Content-Type =| "text/event-stream")'
                  Name: JS-inject-deidentified-finding
              - Step:
                  Condition: '!(stream = true) and (response.status.code < 400) and (request_format = "gemini") and (gemini_json_array_stream != "true") and (response_tokens_extracted != "true") and (vertex_predict_embeddings != "true")'
                  Name: EV-ExtractMetadataNonStreamingGemini
              - Step:
                  Condition: '!(stream = true) and (response.status.code < 400) and (request_format = "claude") and (response_tokens_extracted != "true") and (vertex_predict_embeddings != "true")'
                  Name: EV-ExtractMetadataNonStreaming
              - Step:
                  Condition: '!(stream = true) and (response.status.code < 400)'
                  Name: JS-calculate-tokens-non-streaming
              {{- if $modelArmorEnabled }}
              - Step:
                  Condition: '!(stream = true) and (response.status.code < 400) and (model_armor_response_enabled != "false") and (response_partial != null) and (response_partial != "")'
                  Name: SMR-SanitizeModelResponse
              {{- end }}
              {{- if or $monetizationEnabled $quotasEnabled }}
              - Step:
                  Condition: '!(stream = true) and (response.status.code < 400)'
                  Name: JS-calculate-monetization-cost
              {{- end }}
              - Step:
                  Condition: '!(stream = true) and (response.status.code < 400)'
                  Name: DC-CaptureTokenCountsNonStreaming
              {{- if $quotasEnabled }}
              - Step:
                  Condition: (!(stream = true)) AND (response.status.code < 400) AND (((usage_total_tokens != null) AND (usage_total_tokens != "0")) OR ((judge_total_tokens != null) AND (judge_total_tokens != "0"))) AND (apiproduct.name != null)
                  Name: LTQ-CountOnly
              {{- if $secondaryQuotaEnabled }}
              - Step:
                  Condition: (!(stream = true)) AND (response.status.code < 400) AND (((usage_total_tokens != null) AND (usage_total_tokens != "0")) OR ((judge_total_tokens != null) AND (judge_total_tokens != "0"))) AND (apiproduct.name != null)
                  Name: LTQ-SecondaryCountOnly
              {{- end }}
              - Step:
                  Condition: '!(stream = true) and (response.status.code < 400)'
                  Name: AM-SetQuotaHeaders
              {{- end }}
              {{- if $monetizationEnabled }}
              - Step:
                  Condition: '!(stream = true) and (response.status.code < 400)'
                  Name: AM-SetMonetizationHeaders
              {{- end }}
        - Flows: {}
        - HTTPProxyConnection:
            BasePath: {{ if and $.Values.endpoints $.Values.endpoints.gemini_native }}{{ $.Values.endpoints.gemini_native.base_path | default "/ai-gateway" }}{{ else }}/ai-gateway{{ end }}
            Properties:
              - Property:
                  .name: api.timeout
                  -Data: 300000
        {{- if $dedicatedSseTargets }}
        - RouteRule:
            .name: openai-custom-sse
            Condition: (stream = true) and (route_target = "openai-custom")
            TargetEndpoint: openai-custom-sse
        - RouteRule:
            .name: claude-sse
            Condition: (stream = true) and ((route_target = "claude") or (proxy.pathsuffix MatchesPath "/v1/projects/*/locations/*/publishers/anthropic/models/*"))
            TargetEndpoint: claude-sse
        - RouteRule:
            .name: gemini-native-target-sse
            Condition: stream = true
            TargetEndpoint: gemini-native-target-sse
        {{- end }}
        - RouteRule:
            .name: openai-custom
            Condition: route_target = "openai-custom"
            TargetEndpoint: openai-custom
        - RouteRule:
            .name: claude
            Condition: route_target = "claude" or proxy.pathsuffix MatchesPath "/v1/projects/*/locations/*/publishers/anthropic/models/*"
            TargetEndpoint: claude
        - RouteRule:
            .name: gemini-native-target
            TargetEndpoint: gemini-native-target
  {{- end }}

  {{- if or (not $.Values.endpoints) (not $.Values.endpoints.openai_compat) (and $.Values.endpoints.openai_compat (ne $.Values.endpoints.openai_compat.enabled false)) }}
  - ProxyEndpoint:
      .name: {{ if and $.Values.endpoints $.Values.endpoints.openai_compat }}{{ $.Values.endpoints.openai_compat.name | default "openai-compat" }}{{ else }}openai-compat{{ end }}
      -Data:
        - Description: OpenAI Compatibility API Proxy Endpoint for Gemini
        - FaultRules:
            {{- if $modelArmorEnabled }}
            - FaultRule:
                .name: sanitize
                -Data:
                  {{- if and $.Values.features $.Values.features.rate_limits (or (and $.Values.features.rate_limits.concurrency $.Values.features.rate_limits.concurrency.enabled) $.Values.features.rate_limits.enabled) }}
                  - Step:
                      Condition: (ratelimit.Q-ConcurrencyLimit.used.count != null) and (apigee.metrics.policy.RQ-ReleaseConcurrencySlot.timeTaken = null)
                      Name: RQ-ReleaseConcurrencySlot
                  {{- end }}
                  - Step:
                      Name: JS-inject-deidentified-finding
                  - Step:
                      Name: AM-CustomError
                  - Condition: (SanitizeUserPrompt.SUP-SanitizeUserPrompt.filterMatchState = "MATCH_FOUND") OR (SanitizeModelResponse.SMR-SanitizeModelResponse.filterMatchState = "MATCH_FOUND") OR (SanitizeModelResponse.SMR-SanitizeModelResponse.sdpFilterResult.deidentifyResult.matchState = "MATCH_FOUND") OR (SanitizeUserPrompt.SUP-SanitizeUserPrompt.sdpFilterResult.deidentifyResult.matchState = "MATCH_FOUND")
            {{- end }}
            - FaultRule:
                .name: rate-limit
                -Data:
                  {{- if and $.Values.features $.Values.features.rate_limits (or (and $.Values.features.rate_limits.concurrency $.Values.features.rate_limits.concurrency.enabled) $.Values.features.rate_limits.enabled) }}
                  - Step:
                      Condition: (ratelimit.Q-ConcurrencyLimit.used.count != null) and (apigee.metrics.policy.RQ-ReleaseConcurrencySlot.timeTaken = null)
                      Name: RQ-ReleaseConcurrencySlot
                  {{- end }}
                  - Step:
                      Name: JS-format-rate-limit-error
                  - Step:
                      Name: AM-RateLimitError
                  - Condition: (fault.name = "QuotaViolation") OR (fault.name = "SpikeArrestViolation") OR (fault.name = "PromptTokenLimitViolation") OR (preflight_quota_exceeded = "true") OR (ratelimit.SA-BurstRateLimit.failed = true) OR (ratelimit.Q-ConcurrencyLimit.failed = true) OR (ratelimit.LTQ-EnforceOnly.failed = true) OR (ratelimit.LTQ-SecondaryEnforceOnly.failed = true)
            {{- include "callout_abort_faultrule" . | nindent 12 }}
        {{- include "default_fault_rule" . | nindent 8 }}

        - PreFlow:
            .name: PreFlow
            Request:
              {{- if or (not $.Values.features) (not $.Values.features.auth) (and $.Values.features.auth (ne $.Values.features.auth.enabled false)) }}
              {{- include "auth_preflow_steps" . | nindent 14 }}
              {{- end }}
              {{- if $enforceApigeeWallet }}
              - Step:
                  Name: MLC-EnforceMonetizationLimits
              {{- end }}
              - Step:
                  Condition: '(proxy.pathsuffix = "") or (proxy.pathsuffix = null)'
                  Name: AM-NormalizePathSuffix
              - Step:
                  Name: OAS-VerifyOpenAI
              - Step:
                  Name: JS-extract-vars-openai
              - Step:
                  Name: JS-resolve-model-location
              - Step:
                  Condition: model_access_denied = "true"
                  Name: RF-Unauthorized
              {{- if or (not $.Values.features) (not $.Values.features.circuit_breaker) (ne $.Values.features.circuit_breaker.enabled false) }}
              {{- include "circuit_breaker_preflow_steps" . | nindent 14 }}
              {{- end }}
              {{- if and $.Values.features $.Values.features.rate_limits (or (and $.Values.features.rate_limits.burst $.Values.features.rate_limits.burst.enabled) $.Values.features.rate_limits.enabled) }}
              - Step:
                  Name: SA-BurstRateLimit
              {{- end }}
              {{- if $promptTokenLimitEnabled }}
              - Step:
                  Condition: (extracted_prompt != null) and (extracted_prompt != "")
                  Name: PTL-PromptTokenLimit
              {{- end }}
              {{- if $quotasEnabled }}
              - Step:
                  Condition: '(apiproduct.name != null) and (zero_primary_quota != "true")'
                  Name: LTQ-EnforceOnly
              {{- if $secondaryQuotaEnabled }}
              - Step:
                  Condition: '(apiproduct.name != null) and (zero_primary_quota != "true") and (zero_secondary_quota != "true")'
                  Name: LTQ-SecondaryEnforceOnly
              {{- end }}
              - Step:
                  Condition: '(apiproduct.name != null) and ((zero_primary_quota = "true"){{ if $secondaryQuotaEnabled }} or (zero_secondary_quota = "true"){{ end }} or ((propertyset.config.preflight_prompt_guard = "true") and (prompt_char_len != null) and (prompt_char_len != "0")))'
                  Name: JS-resolve-model-location
              {{- end }}
              {{- if and $.Values.features $.Values.features.rate_limits (or (and $.Values.features.rate_limits.concurrency $.Values.features.rate_limits.concurrency.enabled) $.Values.features.rate_limits.enabled) }}
              - Step:
                  Name: Q-ConcurrencyLimit
              {{- end }}
              {{- if $modelArmorEnabled }}
