                  Condition: (model_armor_request_enabled != "false") and (extracted_prompt != null) and (extracted_prompt != "")
                  Name: SUP-SanitizeUserPrompt
              {{- end }}
              {{- if $llmJudgeEnabled }}
              {{- include "judge_post_guardrail_steps" . | nindent 14 }}
              {{- end }}
            Response: {}
        - PostFlow:
            .name: PostFlow
            Request: {}
            Response:
              {{- if and $.Values.features $.Values.features.rate_limits (or (and $.Values.features.rate_limits.concurrency $.Values.features.rate_limits.concurrency.enabled) $.Values.features.rate_limits.enabled) }}
              - Step:
                  Condition: {{ if and $secondaryQuotaEnabled $modelArmorEnabled }}'(ratelimit.Q-ConcurrencyLimit.used.count != null) and (apigee.metrics.policy.RQ-ReleaseConcurrencySlot.timeTaken = null)'{{ else }}'(!(stream = true) or (response.status.code >= 400) or !(response.header.Content-Type =| "text/event-stream")) and (ratelimit.Q-ConcurrencyLimit.used.count != null) and (apigee.metrics.policy.RQ-ReleaseConcurrencySlot.timeTaken = null)'{{ end }}
                  Name: RQ-ReleaseConcurrencySlot
              {{- end }}
              {{- if or (not $.Values.features) (not $.Values.features.circuit_breaker) (ne $.Values.features.circuit_breaker.enabled false) }}
              {{- include "fallback_postflow_steps" . | nindent 14 }}
              {{- end }}
              - Step:
                  Condition: '(response.status.code >= 400) and (propertyset.config.sanitize_upstream_errors = "true") and !(response.header.Content-Type =| "text/event-stream")'
                  Name: JS-inject-deidentified-finding
              - Step:
                  Condition: '!(stream = true) and (response.status.code < 400) and (response_tokens_extracted != "true") and (vertex_predict_embeddings != "true")'
                  Name: EV-ExtractMetadataNonStreamingOpenAI
              - Step:
                  Condition: '!(stream = true) and (response.status.code < 400)'
                  Name: JS-calculate-tokens-non-streaming
              {{- if $modelArmorEnabled }}
              - Step:
                  Condition: '!(stream = true) and (response.status.code < 400) and (model_armor_response_enabled != "false") and (response_partial != null) and (response_partial != "")'
                  Name: SMR-SanitizeModelResponse
              {{- end }}
              {{- if or $monetizationEnabled $quotasEnabled }}
              - Step:
                  Condition: '!(stream = true) and (response.status.code < 400)'
                  Name: JS-calculate-monetization-cost
              {{- end }}
              - Step:
                  Condition: '!(stream = true) and (response.status.code < 400)'
                  Name: DC-CaptureTokenCountsNonStreaming
              {{- if $quotasEnabled }}
              - Step:
                  Condition: (!(stream = true)) AND (response.status.code < 400) AND (((usage_total_tokens != null) AND (usage_total_tokens != "0")) OR ((judge_total_tokens != null) AND (judge_total_tokens != "0"))) AND (apiproduct.name != null)
                  Name: LTQ-CountOnly
              {{- if $secondaryQuotaEnabled }}
              - Step:
                  Condition: (!(stream = true)) AND (response.status.code < 400) AND (((usage_total_tokens != null) AND (usage_total_tokens != "0")) OR ((judge_total_tokens != null) AND (judge_total_tokens != "0"))) AND (apiproduct.name != null)
                  Name: LTQ-SecondaryCountOnly
              {{- end }}
              - Step:
                  Condition: '!(stream = true) and (response.status.code < 400)'
                  Name: AM-SetQuotaHeaders
              {{- end }}
              {{- if $monetizationEnabled }}
              - Step:
                  Condition: '!(stream = true) and (response.status.code < 400)'
                  Name: AM-SetMonetizationHeaders
              {{- end }}
        - Flows: {}
        - HTTPProxyConnection:
            BasePath: {{ if and $.Values.endpoints $.Values.endpoints.openai_compat }}{{ $.Values.endpoints.openai_compat.base_path | default "/v1/chat/completions" }}{{ else }}/v1/chat/completions{{ end }}
            Properties:
              - Property:
                  .name: api.timeout
                  -Data: 300000
        {{- if $dedicatedSseTargets }}
        - RouteRule:
            .name: openai-custom-sse
            Condition: (stream = true) and (route_target = "openai-custom")
            TargetEndpoint: openai-custom-sse
        - RouteRule:
            .name: claude-sse
            Condition: (stream = true) and ((route_target = "claude") or (route_format = "anthropic"))
            TargetEndpoint: claude-sse
        - RouteRule:
            .name: gemini-openai-compat-sse
            Condition: stream = true
            TargetEndpoint: gemini-openai-compat-sse
        {{- end }}
        - RouteRule:
            .name: openai-custom
            Condition: route_target = "openai-custom"
            TargetEndpoint: openai-custom
        - RouteRule:
            .name: claude
            Condition: (route_target = "claude") or (route_format = "anthropic")
            TargetEndpoint: claude
        - RouteRule:
            .name: gemini-openai-compat
            TargetEndpoint: gemini-openai-compat
  {{- end }}

