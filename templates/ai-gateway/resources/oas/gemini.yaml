components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-apikey
  schemas:
    GeminiRequest:
      type: object
      additionalProperties: true
      required:
        - contents
      properties:
        systemInstruction:
          type: object
          additionalProperties: true
        system_instruction:
          type: object
          additionalProperties: true
        tools:
          type: array
          items:
            type: object
            additionalProperties: true
        toolConfig:
          type: object
          additionalProperties: true
        tool_config:
          type: object
          additionalProperties: true
        generationConfig:
          type: object
          additionalProperties: true
        generation_config:
          type: object
          additionalProperties: true
        safetySettings:
          type: array
          items:
            type: object
            additionalProperties: true
        cachedContent:
          type: string
        labels:
          type: object
          additionalProperties: true
        contents:
          type: array
          items:
            type: object
            additionalProperties: true
            required:
              - parts
            properties:
              role:
                type: string
                enum: [user, model, function, tool]
                example: user
              parts:
                type: array
                items:
                  type: object
                  additionalProperties: true
                  properties:
                    text:
                      type: string
                      example: Describe gravity in one sentence.
                    inlineData:
                      type: object
                      additionalProperties: true
                    fileData:
                      type: object
                      additionalProperties: true
                    functionCall:
                      type: object
                      additionalProperties: true
                    functionResponse:
                      type: object
                      additionalProperties: true
                    thought:
                      type: boolean
    GeminiResponse:
      type: object
      properties:
        candidates:
          type: array
          items:
            type: object
            properties:
              content:
                type: object
                properties:
                  role:
                    type: string
                    example: model
                  parts:
                    type: array
                    items:
                      type: object
                      properties:
                        text:
                          type: string
              finishReason:
                type: string
                example: STOP
        usageMetadata:
          type: object
          properties:
            promptTokenCount:
              type: integer
            candidatesTokenCount:
              type: integer
            totalTokenCount:
              type: integer
    ClaudeRequest:
      type: object
      additionalProperties: true
      required:
        - max_tokens
        - messages
      properties:
        model:
          type: string
          description: Target model identifier (optional when passed in Vertex URL path).
          example: claude-haiku-4-5
        anthropic_version:
          type: string
          example: vertex-2023-10-16
        max_tokens:
          type: integer
          description: Maximum tokens to generate.
          example: 100
        stream:
          type: boolean
          description: Enable SSE streaming response.
          default: false
        system:
          oneOf:
            - type: string
            - type: array
              items:
                type: object
                additionalProperties: true
        temperature:
          type: number
        top_p:
          type: number
        top_k:
          type: integer
        stop_sequences:
          type: array
          items:
            type: string
        tools:
          type: array
          items:
            type: object
            additionalProperties: true
        tool_choice:
          type: object
          additionalProperties: true
        thinking:
          type: object
          additionalProperties: true
        metadata:
          type: object
          additionalProperties: true
        messages:
          type: array
          items:
            type: object
            additionalProperties: true
            required:
              - role
              - content
            properties:
              role:
                type: string
                enum: [user, assistant]
                example: user
              content:
                oneOf:
                  - type: string
                    example: Explain gravity in one sentence.
                  - type: array
                    items:
                      type: object
                      additionalProperties: true
    ClaudeResponse:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          example: message
        role:
          type: string
          example: assistant
        model:
          type: string
        content:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                example: text
              text:
                type: string
        stop_reason:
          type: string
          example: end_turn
        usage:
          type: object
          properties:
            input_tokens:
              type: integer
            output_tokens:
              type: integer
    VertexPredictEmbeddingRequest:
      type: object
      required:
        - instances
      properties:
        instances:
          type: array
          items:
            type: object
            properties:
              content:
                type: string
              text:
                type: string
              task_type:
                type: string
              title:
                type: string
        parameters:
          type: object
          properties:
            outputDimensionality:
              type: integer
            autoTruncate:
              type: boolean
    VertexPredictEmbeddingResponse:
      type: object
      properties:
        predictions:
          type: array
          items:
            type: object
            properties:
              embeddings:
                type: object
                properties:
                  values:
                    type: array
                    items:
                      type: number
                  statistics:
                    type: object
                    properties:
                      truncated:
                        type: boolean
                      token_count:
                        type: integer
    GeminiEmbedContentRequest:
      type: object
      properties:
        model:
          type: string
        content:
          type: object
        taskType:
          type: string
        title:
          type: string
        outputDimensionality:
          type: integer
    GeminiBatchEmbedContentsRequest:
      type: object
      properties:
        requests:
          type: array
          items:
            $ref: '#/components/schemas/GeminiEmbedContentRequest'
    ErrorResponse:
      type: object
      properties:
        fault:
          type: object
          properties:
            faultstring:
              type: string
            detail:
              type: object
              properties:
                errorcode:
                  type: string
                  example: steps.sanitize.user.prompt.FilterMatched
