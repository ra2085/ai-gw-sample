openapi: 3.0.3
info:
  title: AI Gateway - Native Gemini & Vertex Anthropic API
  description: Native Gemini and Vertex AI Anthropic Claude API format endpoints for AI Gateway.
  version: 1.0.0
servers:
  - url: https://workshop.iloveapi.management
security:
  - ApiKeyAuth: []
paths:
  /v1/projects/{projectId}/locations/{locationId}/publishers/google/models/{modelId}:generateContent:
    post:
      tags:
        - Native Gemini Format
      summary: Generate content (Non-Streaming)
      description: Sends a prompt to the specified Gemini model and receives a single complete response.
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: locationId
          in: path
          required: true
          schema:
            type: string
        - name: modelId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeminiRequest'
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeminiResponse'
        '403':
          description: Forbidden. Prompt blocked by safety filters (Model Armor).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

