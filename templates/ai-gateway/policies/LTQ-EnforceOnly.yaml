LLMTokenQuota:
  .continueOnError: false
  .enabled: true
  .name: LTQ-EnforceOnly
  .type: rollingwindow
  DisplayName: LTQ-EnforceOnly
  SharedName: llm-token-counter
  EnforceOnly: true
  Identifier:
    .ref: rate_limit_client_id
  Allow:
    .count: {{ if and $.Values.features $.Values.features.quotas $.Values.features.quotas.default_quota }}{{ $.Values.features.quotas.default_quota }}{{ else }}1000000{{ end }}
    .countRef: primary_quota_limit
  Interval:
    .ref: primary_quota_interval
    -Data: 1
  TimeUnit:
    .ref: primary_quota_unit
    -Data: hour
  Distributed: true
  Synchronous: true
  LLMModelSource: '{model}'
