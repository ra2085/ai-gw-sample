LLMTokenQuota:
  .continueOnError: false
  .enabled: true
  .name: LTQ-CountOnly
  .type: rollingwindow
  DisplayName: LTQ-CountOnly
  SharedName: llm-token-counter
  CountOnly: true
  Identifier:
    .ref: rate_limit_client_id
  Allow:
    .count: {{ if and $.Values.features $.Values.features.quotas (hasKey $.Values.features.quotas "default_quota") (ne $.Values.features.quotas.default_quota nil) (ne (printf "%v" $.Values.features.quotas.default_quota | trim) "") }}{{ include "positive_allow_count" $.Values.features.quotas.default_quota }}{{ else }}1000000{{ end }}
    .countRef: primary_quota_limit
  Interval:
    .ref: primary_quota_interval
    -Data: 1
  TimeUnit:
    .ref: primary_quota_unit
    -Data: hour
  Distributed: true
  Synchronous: {{ if and $.Values.features $.Values.features.quotas (hasKey $.Values.features.quotas "synchronous") (ne $.Values.features.quotas.synchronous nil) }}{{ $.Values.features.quotas.synchronous }}{{ else }}true{{ end }}
  LLMTokenUsageSource: '{primary_quota_usage}'
  LLMModelSource: '{quota_model_bucket}'
