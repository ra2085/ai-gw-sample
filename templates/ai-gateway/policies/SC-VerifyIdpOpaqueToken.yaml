ServiceCallout:
  .continueOnError: true
  .enabled: true
  .name: SC-VerifyIdpOpaqueToken
  DisplayName: SC-VerifyIdpOpaqueToken
  Properties: {}
  Request:
    .clearPayload: true
    .variable: idpOpaqueVerifyRequest
    IgnoreUnresolvedVariables: false
    Set:
      Headers:
        - Header:
            .name: Authorization
            -Data: 'Bearer {auth_bearer_token}'
        - Header:
            .name: Accept
            -Data: application/json
      Verb: GET
  Response: idpOpaqueVerifyResponse
  HTTPTargetConnection:
    Properties:
      Property:
        .name: io.timeout.millis
        -Data: 3000
    URL: '{{ if and $.Values.auth $.Values.auth.idp_opaque $.Values.auth.idp_opaque.userinfo_url }}{{ $.Values.auth.idp_opaque.userinfo_url }}{{ else if and $.Values.features $.Values.features.auth $.Values.features.auth.idp_opaque $.Values.features.auth.idp_opaque.userinfo_url }}{{ $.Values.features.auth.idp_opaque.userinfo_url }}{{ else }}https://idp.example.com/oauth2/v1/userinfo{{ end }}'
