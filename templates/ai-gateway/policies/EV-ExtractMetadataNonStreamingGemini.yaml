ExtractVariables:
  .continueOnError: true
  .enabled: true
  .name: EV-ExtractMetadataNonStreamingGemini
  DisplayName: EV-ExtractMetadataNonStreamingGemini
  IgnoreUnresolvedVariables: true
  JSONPayload:
    - Variable:
        .name: prompt_tokens
        .type: integer
        JSONPath: $.usageMetadata.promptTokenCount
    - Variable:
        .name: completion_tokens
        .type: integer
        JSONPath: $.usageMetadata.candidatesTokenCount
    - Variable:
        .name: cached_content_tokens
        .type: integer
        JSONPath: $.usageMetadata.cachedContentTokenCount
    - Variable:
        .name: thoughts_tokens
        .type: integer
        JSONPath: $.usageMetadata.thoughtsTokenCount
  Source:
    .clearPayload: false
    -Data: response
