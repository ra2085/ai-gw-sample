SetOAuthV2Info:
  .continueOnError: true
  .enabled: true
  .name: OA-SaveTokenAttributes
  DisplayName: OA-SaveTokenAttributes
  AccessToken:
    .ref: auth_bearer_token
  Attributes:
    - Attribute:
        .name: user_id
        .ref: auth_user_id
    - Attribute:
        .name: user_email
        .ref: auth_user_email
    - Attribute:
        .name: persona
        .ref: auth_persona
    - Attribute:
        .name: team
        .ref: auth_team
    - Attribute:
        .name: auth_source
        .ref: auth_token_type
    - Attribute:
        .name: quota_override
        .ref: auth_quota_override
    - Attribute:
        .name: quota_override_expires_at
        .ref: auth_quota_override_expires_at
    - Attribute:
        .name: model_armor_request_template
        .ref: auth_model_armor_request_template
    - Attribute:
        .name: model_armor_response_template
        .ref: auth_model_armor_response_template
