SpikeArrest:
  .continueOnError: false
  .enabled: true
  .name: SA-BurstRateLimit
  DisplayName: SA-BurstRateLimit
  Identifier:
    .ref: {{ if and $.Values.features $.Values.features.rate_limits $.Values.features.rate_limits.burst $.Values.features.rate_limits.burst.identifier_ref }}{{ $.Values.features.rate_limits.burst.identifier_ref }}{{ else }}rate_limit_client_id{{ end }}
  Rate:
    .ref: burst_rate_limit
    -Data: {{ if and $.Values.features $.Values.features.rate_limits $.Values.features.rate_limits.burst $.Values.features.rate_limits.burst.rate }}{{ $.Values.features.rate_limits.burst.rate }}{{ else if and $.Values.features $.Values.features.rate_limits $.Values.features.rate_limits.burst_rate }}{{ $.Values.features.rate_limits.burst_rate }}{{ else }}600pm{{ end }}
  UseEffectiveCount: {{ if and $.Values.features $.Values.features.rate_limits $.Values.features.rate_limits.burst (ne $.Values.features.rate_limits.burst.use_effective_count nil) }}{{ $.Values.features.rate_limits.burst.use_effective_count }}{{ else }}true{{ end }}
