ExtractVariables:
  .continueOnError: true
  .enabled: true
  .name: EV-ExtractMetadataNonStreamingOpenAI
  DisplayName: EV-ExtractMetadataNonStreamingOpenAI
  Properties: {}
  IgnoreUnresolvedVariables: true
  JSONPayload:
    - Variable:
        .name: prompt_tokens
        .type: integer
        JSONPath: $.usage.prompt_tokens
    - Variable:
        .name: completion_tokens
        .type: integer
        JSONPath: $.usage.completion_tokens
    - Variable:
        .name: cached_prompt_tokens
        .type: integer
        JSONPath: $.usage.prompt_tokens_details.cached_tokens
    - Variable:
        .name: reasoning_tokens
        .type: integer
        JSONPath: $.usage.completion_tokens_details.reasoning_tokens
  Source:
    .clearPayload: false
    -Data: response
