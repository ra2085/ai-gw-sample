OAuthV2:
  .continueOnError: true
  .enabled: true
  .name: OA-ImportExternalToken
  DisplayName: OA-ImportExternalToken
  Properties: {}
  Attributes:
    - Attribute:
        .name: user_id
        .ref: auth_user_id
    - Attribute:
        .name: user_email
        .ref: auth_user_email
    - Attribute:
        .name: persona
        .ref: auth_persona
    - Attribute:
        .name: team
        .ref: auth_team
    - Attribute:
        .name: auth_source
        .ref: auth_token_type
    - Attribute:
        .name: quota_override
        .ref: auth_quota_override
    - Attribute:
        .name: quota_override_expires_at
        .ref: auth_quota_override_expires_at
    - Attribute:
        .name: model_armor_request_template
        .ref: auth_model_armor_request_template
    - Attribute:
        .name: model_armor_response_template
        .ref: auth_model_armor_response_template
  ExpiresIn:
    .ref: auth_token_ttl_ms
    -Data: 3600000
  ExternalAccessToken: auth_bearer_token
  ExternalAuthorization: true
  Operation: GenerateAccessToken
  StoreToken: true
  SupportedGrantTypes:
    GrantType: client_credentials
  GenerateResponse:
    .enabled: false
  Tokens: {}
