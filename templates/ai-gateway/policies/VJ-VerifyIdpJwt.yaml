VerifyJWT:
  .continueOnError: false
  .enabled: true
  .name: VJ-VerifyIdpJwt
  DisplayName: VJ-VerifyIdpJwt
  Algorithm: {{ include "resolve_idp_jwt_algorithm" . }}
  Source: auth_bearer_token
  IgnoreUnresolvedVariables: false
  IgnoreCriticalHeaders: false
  IgnoreIssuedAt: false
  TimeAllowance: 30s
  PublicKey:
    JWKS:
      .uriRef: propertyset.config.auth_idp_jwt_jwks_uri
  Issuer:
    .ref: propertyset.config.auth_idp_jwt_issuer
  {{- if eq (include "has_single_exact_idp_jwt_audience" .) "true" }}
  Audience:
    .ref: propertyset.config.auth_idp_jwt_audience
  {{- end }}
