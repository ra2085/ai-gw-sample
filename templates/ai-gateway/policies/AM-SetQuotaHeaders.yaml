AssignMessage:
  .continueOnError: false
  .enabled: true
  .name: AM-SetQuotaHeaders
  DisplayName: AM-SetQuotaHeaders
  Set:
    Headers:
      - Header:
          .name: x-quota-allowed
          -Data: '{ratelimit.LTQ-EnforceOnly.allowed.count}'
      - Header:
          .name: x-quota-used
          -Data: '{ratelimit.LTQ-CountOnly.used.count}'
      - Header:
          .name: x-quota-available
          -Data: '{ratelimit.LTQ-CountOnly.available.count}'
      - Header:
          .name: x-quota-unit
          -Data: '{primary_quota_mode}'
      {{- if and $.Values.features $.Values.features.quotas $.Values.features.quotas.secondary_window $.Values.features.quotas.secondary_window.enabled }}
      - Header:
          .name: x-quota-secondary-allowed
          -Data: '{ratelimit.LTQ-SecondaryEnforceOnly.allowed.count}'
      - Header:
          .name: x-quota-secondary-used
          -Data: '{ratelimit.LTQ-SecondaryCountOnly.used.count}'
      - Header:
          .name: x-quota-secondary-available
          -Data: '{ratelimit.LTQ-SecondaryCountOnly.available.count}'
      {{- end }}
      - Header:
          .name: x-quota-ip-used
          -Data: '{ratelimit.LTQ-CountOnly-IP.used.count}'
      - Header:
          .name: x-quota-ip-available
          -Data: '{ratelimit.LTQ-CountOnly-IP.available.count}'
      - Header:
          .name: x-ratelimit-burst-rate
          -Data: '{burst_rate_limit}'
      - Header:
          .name: x-ratelimit-concurrency-limit
          -Data: '{ratelimit.Q-ConcurrencyLimit.allowed.count}'
      - Header:
          .name: x-ratelimit-concurrency-active
          -Data: '{ratelimit.Q-ConcurrencyLimit.used.count}'
      - Header:
          .name: x-ratelimit-concurrency-available
          -Data: '{ratelimit.Q-ConcurrencyLimit.available.count}'
      - Header:
          .name: X-Gateway-Requested-Model
          -Data: '{requested_model}'
      - Header:
          .name: X-Gateway-Routed-Model
          -Data: '{primary_model}'
      - Header:
          .name: X-Gateway-Cost-Tier
          -Data: '{cost_tier}'
      - Header:
          .name: X-Gateway-Fallback-Model
          -Data: '{fallback_model}'
      - Header:
          .name: X-Gateway-Fallback-Triggered
          -Data: '{fallback_triggered}'
      - Header:
          .name: X-Gateway-Circuit-Breaker
          -Data: '{circuit_breaker_state}'
      - Header:
          .name: X-Gateway-Judge-Task
          -Data: '{judge_task}'
      - Header:
          .name: X-Gateway-Judge-Complexity
          -Data: '{judge_complexity}'
      - Header:
          .name: X-Gateway-Judge-Tier
          -Data: '{judge_tier}'
      - Header:
          .name: X-Gateway-Model-Armor-Request-Template
          -Data: '{model_armor_request_template}'
      - Header:
          .name: X-Gateway-Model-Armor-Response-Template
          -Data: '{model_armor_response_template}'
      - Header:
          .name: X-Gateway-Model-Armor-Source
          -Data: '{model_armor_source}'
      - Header:
          .name: X-Gateway-Auth-Source
          -Data: '{upstream_auth_source}'
      - Header:
          .name: X-Gateway-Provider-Account
          -Data: '{openai_org_id}'
      - Header:
          .name: X-Gateway-Identity-Persona
          -Data: '{identity_persona}'
  IgnoreUnresolvedVariables: true
  AssignTo:
    .createNew: false
    .transport: http
    .type: response
