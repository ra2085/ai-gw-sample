AssignMessage:
  .continueOnError: false
  .enabled: true
  .name: AM-CustomError
  DisplayName: AM-CustomError
  Properties: {}
  Set:
    Headers:
      - Header:
          .name: Content-Type
          -Data: application/json
      - Header:
          .name: X-Content-Type-Options
          -Data: nosniff
    Payload:
      .contentType: application/json
      -Data: '{auth_error_payload}'
    StatusCode: '{auth_error_status}'
  IgnoreUnresolvedVariables: true
  AssignTo:
    .createNew: false
    .transport: http
    .type: response
    -Data: error
