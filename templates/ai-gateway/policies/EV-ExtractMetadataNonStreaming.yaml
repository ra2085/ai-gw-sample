ExtractVariables:
  .continueOnError: true
  .enabled: true
  .name: EV-ExtractMetadataNonStreaming
  DisplayName: EV-ExtractMetadataNonStreaming
  Properties: {}
  IgnoreUnresolvedVariables: true
  JSONPayload:
    - Variable:
        .name: prompt_tokens
        .type: integer
        JSONPath: $.usage.input_tokens
    - Variable:
        .name: completion_tokens
        .type: integer
        JSONPath: $.usage.output_tokens
    - Variable:
        .name: cache_read_input_tokens
        .type: integer
        JSONPath: $.usage.cache_read_input_tokens
    - Variable:
        .name: cache_creation_input_tokens
        .type: integer
        JSONPath: $.usage.cache_creation_input_tokens
  Source:
    .clearPayload: false
    -Data: response
