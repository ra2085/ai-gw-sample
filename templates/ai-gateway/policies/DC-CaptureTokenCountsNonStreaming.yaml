DataCapture:
  .name: DC-CaptureTokenCountsNonStreaming
  .continueOnError: false
  .enabled: true
  -Data:
    - DisplayName: DC-CaptureTokenCountsNonStreaming
    - IgnoreUnresolvedVariables: true
    - ThrowExceptionOnLimit: false
    - Capture:
        Collect:
          .ref: prompt_tokens
          .default: 0
        DataCollector: dc_prompt_token_count
    - Capture:
        Collect:
          .ref: uncached_prompt_tokens
          .default: 0
        DataCollector: dc_uncached_prompt_token_count
    - Capture:
        Collect:
          .ref: cache_read_tokens
          .default: 0
        DataCollector: dc_cache_read_token_count
    - Capture:
        Collect:
          .ref: cache_write_tokens
          .default: 0
        DataCollector: dc_cache_write_token_count
    - Capture:
        Collect:
          .ref: thinking_tokens
          .default: 0
        DataCollector: dc_thinking_token_count
    - Capture:
        Collect:
          .ref: completion_tokens
          .default: 0
        DataCollector: dc_completion_token_count
    - Capture:
        Collect:
          .ref: usage_total_tokens
          .default: 0
        DataCollector: dc_total_token_count
    - Capture:
        Collect:
          .ref: model
          .default: unknown
        DataCollector: dc_model
    - Capture:
        Collect:
          .ref: requested_model
          .default: direct
        DataCollector: dc_requested_model
    - Capture:
        Collect:
          .ref: tx_uncached_prompt_cost_usd
          .default: 0.000000
        DataCollector: dc_tx_uncached_prompt_cost_usd
    - Capture:
        Collect:
          .ref: tx_cache_read_cost_usd
          .default: 0.000000
        DataCollector: dc_tx_cache_read_cost_usd
    - Capture:
        Collect:
          .ref: tx_cache_write_cost_usd
          .default: 0.000000
        DataCollector: dc_tx_cache_write_cost_usd
    - Capture:
        Collect:
          .ref: tx_prompt_cost_usd
          .default: 0.000000
        DataCollector: dc_tx_prompt_cost_usd
    - Capture:
        Collect:
          .ref: tx_completion_cost_usd
          .default: 0.000000
        DataCollector: dc_tx_completion_cost_usd
    - Capture:
        Collect:
          .ref: tx_cost_usd
          .default: 0.000000
        DataCollector: dc_tx_cost_usd
    - Capture:
        Collect:
          .ref: identity_user_id
          .default: anonymous
        DataCollector: dc_identity_user_id
    - Capture:
        Collect:
          .ref: identity_persona
          .default: default
        DataCollector: dc_identity_persona
    - Capture:
        Collect:
          .ref: identity_team
          .default: default
        DataCollector: dc_identity_team
    - Capture:
        Collect:
          .ref: perUnitPriceMultiplier
          .default: 1.0
        DataCollector:
          .scope: monetization
          -Data: perUnitPriceMultiplier
    - Capture:
        Collect:
          .ref: currency
          .default: USD
        DataCollector:
          .scope: monetization
          -Data: currency
    - Capture:
        Collect:
          .ref: transactionSuccess
          .default: true
        DataCollector:
          .scope: monetization
          -Data: transactionSuccess
