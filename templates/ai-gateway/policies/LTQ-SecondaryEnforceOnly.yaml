LLMTokenQuota:
  .continueOnError: false
  .enabled: true
  .name: LTQ-SecondaryEnforceOnly
  .type: flexi
  DisplayName: LTQ-SecondaryEnforceOnly
  SharedName: {{ if and $.Values.features $.Values.features.quotas $.Values.features.quotas.secondary_window }}{{ $.Values.features.quotas.secondary_window.shared_name | default "llm-token-counter-secondary" }}{{ else }}llm-token-counter-secondary{{ end }}
  EnforceOnly: true
  Identifier:
    .ref: {{ if and $.Values.features $.Values.features.quotas $.Values.features.quotas.secondary_window }}{{ $.Values.features.quotas.secondary_window.identifier_ref | default "secondary_quota_identifier" }}{{ else }}secondary_quota_identifier{{ end }}
  Allow:
    .count: {{ if and $.Values.features $.Values.features.quotas $.Values.features.quotas.secondary_window }}{{ if and (hasKey $.Values.features.quotas.secondary_window "allow_usd") (ne $.Values.features.quotas.secondary_window.allow_usd nil) (ne (printf "%v" $.Values.features.quotas.secondary_window.allow_usd | trim) "") }}{{ include "positive_allow_count" (include "usd_to_micro" $.Values.features.quotas.secondary_window.allow_usd) }}{{ else if and (hasKey $.Values.features.quotas.secondary_window "allow_count") (ne $.Values.features.quotas.secondary_window.allow_count nil) (ne (printf "%v" $.Values.features.quotas.secondary_window.allow_count | trim) "") }}{{ include "positive_allow_count" $.Values.features.quotas.secondary_window.allow_count }}{{ else }}1000000{{ end }}{{ else }}1000000{{ end }}
    .countRef: {{ if and $.Values.features $.Values.features.quotas $.Values.features.quotas.secondary_window }}{{ $.Values.features.quotas.secondary_window.allow_ref | default "secondary_quota_limit" }}{{ else }}secondary_quota_limit{{ end }}
  Interval:
    .ref: {{ if and $.Values.features $.Values.features.quotas $.Values.features.quotas.secondary_window }}{{ $.Values.features.quotas.secondary_window.interval_ref | default "secondary_quota_interval" }}{{ else }}secondary_quota_interval{{ end }}
    -Data: {{ if and $.Values.features $.Values.features.quotas $.Values.features.quotas.secondary_window }}{{ $.Values.features.quotas.secondary_window.interval | default 7 }}{{ else }}7{{ end }}
  TimeUnit:
    .ref: {{ if and $.Values.features $.Values.features.quotas $.Values.features.quotas.secondary_window }}{{ $.Values.features.quotas.secondary_window.time_unit_ref | default "secondary_quota_unit" }}{{ else }}secondary_quota_unit{{ end }}
    -Data: {{ if and $.Values.features $.Values.features.quotas $.Values.features.quotas.secondary_window }}{{ $.Values.features.quotas.secondary_window.time_unit | default "day" }}{{ else }}day{{ end }}
  Distributed: true
  Synchronous: {{ if and $.Values.features $.Values.features.quotas $.Values.features.quotas.secondary_window (hasKey $.Values.features.quotas.secondary_window "synchronous") (ne $.Values.features.quotas.secondary_window.synchronous nil) }}{{ $.Values.features.quotas.secondary_window.synchronous }}{{ else }}true{{ end }}
  LLMModelSource: '{secondary_quota_scope}'
