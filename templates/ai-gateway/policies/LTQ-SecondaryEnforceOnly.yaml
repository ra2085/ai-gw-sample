LLMTokenQuota:
  .continueOnError: false
  .enabled: true
  .name: LTQ-SecondaryEnforceOnly
  .type: rollingwindow
  DisplayName: LTQ-SecondaryEnforceOnly
  SharedName: {{ if and $.Values.features $.Values.features.quotas $.Values.features.quotas.secondary_window }}{{ $.Values.features.quotas.secondary_window.shared_name | default "llm-token-counter-secondary" }}{{ else }}llm-token-counter-secondary{{ end }}
  EnforceOnly: true
  Identifier:
    .ref: {{ if and $.Values.features $.Values.features.quotas $.Values.features.quotas.secondary_window }}{{ $.Values.features.quotas.secondary_window.identifier_ref | default "secondary_quota_identifier" }}{{ else }}secondary_quota_identifier{{ end }}
  Allow:
    .count: {{ if and $.Values.features $.Values.features.quotas $.Values.features.quotas.secondary_window }}{{ $.Values.features.quotas.secondary_window.allow_count | default 1000000 }}{{ else }}1000000{{ end }}
    .countRef: {{ if and $.Values.features $.Values.features.quotas $.Values.features.quotas.secondary_window }}{{ $.Values.features.quotas.secondary_window.allow_ref | default "verifyapikey.VA-ApiKey.apiproduct.secondary_quota_limit" }}{{ else }}verifyapikey.VA-ApiKey.apiproduct.secondary_quota_limit{{ end }}
  Interval:
    .ref: {{ if and $.Values.features $.Values.features.quotas $.Values.features.quotas.secondary_window }}{{ $.Values.features.quotas.secondary_window.interval_ref | default "verifyapikey.VA-ApiKey.apiproduct.secondary_quota_interval" }}{{ else }}verifyapikey.VA-ApiKey.apiproduct.secondary_quota_interval{{ end }}
    -Data: {{ if and $.Values.features $.Values.features.quotas $.Values.features.quotas.secondary_window }}{{ $.Values.features.quotas.secondary_window.interval | default 7 }}{{ else }}7{{ end }}
  TimeUnit:
    .ref: {{ if and $.Values.features $.Values.features.quotas $.Values.features.quotas.secondary_window }}{{ $.Values.features.quotas.secondary_window.time_unit_ref | default "verifyapikey.VA-ApiKey.apiproduct.secondary_quota_unit" }}{{ else }}verifyapikey.VA-ApiKey.apiproduct.secondary_quota_unit{{ end }}
    -Data: {{ if and $.Values.features $.Values.features.quotas $.Values.features.quotas.secondary_window }}{{ $.Values.features.quotas.secondary_window.time_unit | default "day" }}{{ else }}day{{ end }}
  Distributed: true
  LLMModelSource: '{model}'
