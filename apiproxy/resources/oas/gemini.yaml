                $ref: '#/components/schemas/ErrorResponse'

  /v1/projects/{projectId}/locations/{locationId}/publishers/google/models/{modelId}:streamGenerateContent:
    post:
      tags:
        - Native Gemini Format
      summary: Stream generate content (Streaming)
      description: Sends a prompt to the specified Gemini model and receives a real-time Server-Sent Events stream.
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: locationId
          in: path
          required: true
          schema:
            type: string
        - name: modelId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeminiRequest'
      responses:
        '200':
          description: Successful streaming event stream response.
          content:
            text/event-stream:
              schema:
                type: string
        '403':
          description: Forbidden. Prompt blocked by safety filters (Model Armor).
          content:
