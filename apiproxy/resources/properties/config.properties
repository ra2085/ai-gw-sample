project_id=cymbal-ai
model_armor_project_id=cymbal-ai
model_armor_location=us-central1
model_armor_template=ai-gw-template
model_armor_request_template=ai-gw-template
model_armor_response_template=ai-gw-template
default_burst_rate=600pm
default_concurrency_limit=20
cb_error_threshold=3
cb_window_interval=1
cb_window_unit=minute

# Authentication & Persona-Based Token Import Configuration
auth_allow_bearer_api_key=true
auth_agent_token_enabled=true
auth_agent_allowed_trust_domain=.system.id.goog
auth_agent_allowed_email_suffix=.iam.gserviceaccount.com
auth_agent_persona=agent
auth_agent_token_ttl_ms=3600000

auth_idp_opaque_enabled=true
auth_idp_opaque_userinfo_url=https://workshop.iloveapi.management/mock/oauth2/v1/userinfo
auth_idp_opaque_user_claim=email
auth_idp_opaque_persona_claim=role
auth_idp_opaque_team_claim=department
auth_idp_opaque_quota_override_claim=ai_quota_override
auth_idp_opaque_token_ttl_ms=3600000

auth_idp_jwt_enabled=false
auth_idp_jwt_jwks_uri=https://idp.example.com/oauth2/v1/keys
auth_idp_jwt_issuer=https://idp.example.com
auth_idp_jwt_user_claim=email
auth_idp_jwt_persona_claim=role
auth_idp_jwt_team_claim=department
auth_idp_jwt_quota_override_claim=ai_quota_override
auth_idp_jwt_token_ttl_ms=3600000
auth_personas_list=agent,developer,it,knowledge-worker
auth_persona_default=
persona.agent.match_claims=principal://agents.global.org-*.system.id.goog/*,*@*.iam.gserviceaccount.com,agent
persona.agent.client_id=HIszfdIJJ1Sq60TchkAAxc54SPsUlCf4q1TZKxcRqUGRZYfJ
persona.developer.match_claims=swe-*,engineering,developer
persona.developer.client_id=HIszfdIJJ1Sq60TchkAAxc54SPsUlCf4q1TZKxcRqUGRZYfJ
persona.it.match_claims=sre-*,devops,it
persona.it.client_id=HIszfdIJJ1Sq60TchkAAxc54SPsUlCf4q1TZKxcRqUGRZYfJ
persona.knowledge-worker.match_claims=business-*,knowledge-worker,general
persona.knowledge-worker.client_id=HIszfdIJJ1Sq60TchkAAxc54SPsUlCf4q1TZKxcRqUGRZYfJ