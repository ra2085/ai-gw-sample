project_id=your-project-id
model_armor_project_id=your-project-id
model_armor_location=us-central1
model_armor_template=ai-gw-template
default_burst_rate=600pm
default_concurrency_limit=20

# Authentication & Persona-Based Token Import Configuration
auth_allow_bearer_api_key=true
auth_agent_token_enabled=false
auth_agent_allowed_email_suffix=.iam.gserviceaccount.com
auth_agent_persona=agent
auth_agent_token_ttl_ms=3600000

auth_idp_opaque_enabled=false
auth_idp_opaque_userinfo_url=https://idp.example.com/oauth2/v1/userinfo
auth_idp_opaque_user_claim=email
auth_idp_opaque_persona_claim=role
auth_idp_opaque_team_claim=department
auth_idp_opaque_quota_override_claim=ai_quota_override
auth_idp_opaque_token_ttl_ms=3600000

auth_idp_jwt_enabled=false
auth_idp_jwt_jwks_uri=https://idp.example.com/oauth2/v1/keys
auth_idp_jwt_issuer=https://idp.example.com
auth_idp_jwt_user_claim=email
auth_idp_jwt_persona_claim=role
auth_idp_jwt_team_claim=department
auth_idp_jwt_quota_override_claim=ai_quota_override
auth_idp_jwt_token_ttl_ms=3600000

auth_personas_list=knowledge-worker,developer,it,agent
auth_persona_default=
persona.knowledge-worker.match_claims=knowledge-worker,general,business
persona.knowledge-worker.client_id=
persona.developer.match_claims=developer,engineering,swe,data-science
persona.developer.client_id=
persona.it.match_claims=it,platform-admin,sre,devops,secops
persona.it.client_id=
persona.agent.match_claims=agent,service-account,automation
persona.agent.client_id=