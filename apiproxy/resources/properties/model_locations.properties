# ==============================================================================
# SECTION 1: DYNAMIC CATALOG & DEFAULT ROUTING
# ==============================================================================
# Master list consumed dynamically by /v1/models endpoint (models_endpoint.js)
models.catalog=gemini-3.7-flash,gemini-3.5-flash,gemini-3.1-flash-lite,gemini-2.5-pro,gemini-2.5-flash,claude-haiku-4-5

# Global defaults
default.model=gemini-3.5-flash
default.fallback=gemini-3.1-flash-lite
default.target=gemini
default.publisher=google

# ==============================================================================
# SECTION 2: SMART ROUTER TIERS & TASK MAPPINGS
# ==============================================================================
# Cost-tier selection (Smart Router cost_tier plugin)
tier.low=gemini-3.1-flash-lite
tier.medium=gemini-3.5-flash
tier.high=gemini-2.5-pro
tier.max=claude-haiku-4-5

# Task-based classifier routing
task.coding=gemini-2.5-pro
task.reasoning=gemini-2.5-pro
task.summarization=gemini-3.1-flash-lite
task.simple_chat=gemini-3.5-flash
task.classifier_model=gemini-3.1-flash-lite

# ==============================================================================
# SECTION 3: BACKWARD COMPATIBILITY ALIASES & REWRITES
# ==============================================================================
# Legacy Gemini 1.5 & Previews -> Modern Gemini 2.5/3.5/3.7 mappings
alias.gemini-1.5-flash=gemini-3.5-flash
alias.gemini-1.5-flash-001=gemini-3.5-flash
alias.gemini-1.5-pro=gemini-2.5-pro
alias.gemini-1.5-pro-001=gemini-2.5-pro
alias.gemini-3.1-pro=gemini-2.5-pro
alias.gemini-3.5-flash-lite=gemini-3.1-flash-lite

# Claude model mappings
alias.claude-3-5-sonnet=claude-haiku-4-5
alias.claude-3-5-haiku=claude-haiku-4-5

# OpenAI / Smart Router aliases
alias.gpt-4o=gemini-2.5-pro
alias.gpt-4o-mini=gemini-3.1-flash-lite
alias.auto=gemini-3.5-flash
alias.gateway/auto=gemini-3.5-flash
alias.auto:judge=gemini-3.5-flash
alias.gateway/judge=gemini-3.5-flash

